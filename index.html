<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column with a docked capture pill and bottom nav; at 900px+ the nav becomes a left rail. */
:root{
  --bg:#ffffff; --surface:#F4F6FA; --surface-2:#E9EEF5; --line:#E0E6EE;
  --fg:#0D1B34; --muted:#56647E;
  --primary:#0F2747; --on-primary:#ffffff;
  --accent:#0B8A8A; --accent-soft:#DDF2F1; --accent-fg:#066464;
  --hero-bg:#0F2747; --hero-fg:#ffffff; --hero-mute:#A9BAD6; --hero-line:rgba(255,255,255,.16); --hero-num:#5ED6CF;
  --ok:#17804F; --ok-soft:#DFF3E8; --warn:#A86500; --warn-soft:#FFF0D2; --crit:#C42F29; --crit-soft:#FCE3E1;
  --shadow:0 1px 2px rgba(13,27,52,.06),0 8px 24px rgba(13,27,52,.07);
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --r:16px; --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#111D31; --surface-2:#192843; --line:#223250;
  --fg:#E7ECF5; --muted:#9AA9C1;
  --primary:#3DC2BC; --on-primary:#06222A;
  --accent:#3DC2BC; --accent-soft:#123539; --accent-fg:#7BE0DA;
  --hero-bg:#13294A; --hero-fg:#F2F6FC; --hero-mute:#9FB2D2; --hero-line:rgba(255,255,255,.14); --hero-num:#5ED6CF;
  --ok:#4CC88A; --ok-soft:#113022; --warn:#F0B34A; --warn-soft:#38290F; --crit:#FF8078; --crit-soft:#3C1A1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#111D31; --surface-2:#192843; --line:#223250;
  --fg:#E7ECF5; --muted:#9AA9C1;
  --primary:#3DC2BC; --on-primary:#06222A;
  --accent:#3DC2BC; --accent-soft:#123539; --accent-fg:#7BE0DA;
  --hero-bg:#13294A; --hero-fg:#F2F6FC; --hero-mute:#9FB2D2; --hero-line:rgba(255,255,255,.14); --hero-num:#5ED6CF;
  --ok:#4CC88A; --ok-soft:#113022; --warn:#F0B34A; --warn-soft:#38290F; --crit:#FF8078; --crit-soft:#3C1A1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.mute{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
#main{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 190px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid transparent}
.proj{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:6px 10px;border-radius:12px;margin-left:-10px}
.proj:hover{background:var(--surface)}
.proj-n{font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.ibtn:hover{background:var(--surface)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-style:normal}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:13px;display:grid;place-items:center}
.net{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.scr-title{font-family:var(--f-disp);font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:8px 0 14px;text-wrap:balance}
.hello{font-family:var(--f-disp);font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:10px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.sec-gap{display:flex;flex-direction:column;gap:14px}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.nv.on{color:var(--accent-fg)}
.nv.on .ic{stroke-width:2.3}
.nv .badge{top:2px;right:calc(50% - 22px)}
.capwrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:25;display:flex;justify-content:center;pointer-events:none;padding-inline:max(12px,env(safe-area-inset-left,0px))}
.cap{pointer-events:auto;display:flex;gap:2px;background:var(--primary);color:var(--on-primary);border-radius:99px;padding:5px;box-shadow:var(--shadow),0 10px 30px rgba(13,27,52,.25)}
.cap button{display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;border-radius:99px;font-weight:600;font-size:14px;color:inherit}
.cap button:hover{background:rgba(255,255,255,.14)}
.cap .tk{background:rgba(255,255,255,.16)}
@media (max-width:380px){.cap button{padding:0 10px;font-size:13px}}
@media (min-width:900px){
  #nav{top:0;right:auto;width:216px;grid-template-columns:1fr;align-content:start;gap:2px;border-top:0;border-right:1px solid var(--line);padding:calc(76px + env(safe-area-inset-top,0px)) 12px 12px}
  .nv{flex-direction:row;gap:12px;padding:11px 12px;font-size:15px;justify-content:flex-start}
  .nv .badge{position:static;margin-left:auto}
  #main{margin-left:232px;margin-right:auto;padding-bottom:120px}
  .capwrap{left:216px;bottom:20px}
  #side-brand{display:flex}
}
#side-brand{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;width:216px;z-index:31;padding:20px 24px;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.03em;align-items:center;gap:8px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary)}

/* segmented tabs */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg .n{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}

/* cards & widgets */
.card{background:var(--surface);border-radius:var(--r);padding:14px}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:16px 16px 6px;box-shadow:var(--shadow)}
.hero h2{font-family:var(--f-disp);font-size:15px;font-weight:600;color:var(--hero-mute);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--hero-line);width:100%;text-align:left;color:inherit}
.fi:first-of-type{border-top:0}
.fi .no{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1;color:var(--hero-num);width:20px;flex:none}
.fi b{display:block;font-weight:650;font-size:16px;line-height:1.25}
.fi small{display:block;color:var(--hero-mute);font-size:13px;margin-top:2px}
.fi .ic{margin-left:auto;color:var(--hero-mute);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.wg{background:var(--surface);border-radius:var(--r);padding:14px 14px 6px;min-width:0}
.wg-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.wg-h h2{font-size:15px;font-weight:700}
.wg-h .ct{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 8px}
.wg-h .lnk{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent-fg)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;min-width:0}
.li:first-of-type{border-top:0}
.li .m{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li .ic.cv{color:var(--muted)}
.empty{padding:14px 0 16px;color:var(--muted);font-size:14px}
.empty-big{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-big b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.insight{background:var(--accent-soft);color:var(--accent-fg);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start}
.insight p{color:var(--fg);font-weight:550}
.insight small{display:block;color:var(--accent-fg);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px;margin-bottom:2px}
.notice{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.notice button{margin-left:auto;font-weight:700;color:var(--accent-fg);white-space:nowrap}
.check-li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.accent{background:var(--accent-soft);color:var(--accent-fg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.ok,.dot.Green{background:var(--ok)}.dot.warn,.dot.Amber{background:var(--warn)}.dot.crit,.dot.Red{background:var(--crit)}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:3px}
.mt{font-size:12.5px;color:var(--muted)}
.mt.warn{color:var(--warn);font-weight:650}.mt.crit{color:var(--crit);font-weight:650}.mt.ok{color:var(--ok);font-weight:650}
.pri{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-Low{background:var(--muted);opacity:.5}.p-Medium{background:var(--accent)}.p-High{background:var(--warn)}.p-Critical{background:var(--crit)}

/* tasks */
.trow{position:relative;overflow:hidden;border-radius:12px;margin-bottom:6px;background:var(--surface-2)}
.trow-bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:14px;color:#fff;gap:8px}
.trow-bg.l{background:var(--ok);justify-content:flex-start}
.trow-bg.r{background:var(--warn);justify-content:flex-end}
.trow-bg{visibility:hidden}
.trow[data-dir="r"] .trow-bg.l,.trow[data-dir="l"] .trow-bg.r{visibility:visible}
.trow-fg{position:relative;background:var(--surface);display:flex;gap:12px;align-items:flex-start;padding:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer;border-radius:12px;transition:transform .18s}
.wg .trow-fg{background:var(--bg)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;position:relative}
.chk::after{content:"absolute";inset:-10px}
.chk:hover{border-color:var(--accent);color:var(--accent)}
.chk.done{background:var(--accent);border-color:var(--accent);color:var(--on-primary)}
.chk.p-Critical{border-color:var(--crit)}.chk.p-High{border-color:var(--warn)}.chk.p-Medium{border-color:var(--accent)}
.ttl{font-weight:600;overflow-wrap:anywhere}
.ttl.done{text-decoration:line-through;color:var(--muted)}
.tmain{flex:1;min-width:0}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;gap:8px}
.grp.crit{color:var(--crit)}
.qa{display:flex;gap:8px;margin-bottom:12px}
.qa input{flex:1}

/* generic list cards */
.lc{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:block;width:100%;text-align:left;margin-bottom:8px;min-width:0}
.lc .h{display:flex;gap:8px;align-items:flex-start}
.lc .h b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:650}
.lc p{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.thumbs .x{position:relative}
.thumbs .x button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug{display:inline-flex;gap:5px;align-items:center;padding:7px 12px;border-radius:99px;background:var(--surface-2);font-weight:600;font-size:13px}
.sug.ai{background:var(--accent-soft);color:var(--accent-fg)}
.why{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.crit b{color:var(--crit)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.wk{font-family:var(--f-disp);font-weight:700;font-size:15px;margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.wk small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:650}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.4}
input[type=range]{min-height:30px;padding:0;accent-color:var(--accent)}
input[type=file]{display:none}
.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--crit)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.frow{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chiprow button{padding:8px 14px;border-radius:99px;background:var(--surface-2);font-weight:600;font-size:14px}
.chiprow button.on{background:var(--primary);color:var(--on-primary)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.scrim{position:absolute;inset:0;background:rgba(6,14,28,.5);animation:fade .18s}
.sheet{position:relative;width:100%;max-width:580px;max-height:94%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.wide{max-width:720px}
@media (min-width:900px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-h h2{flex:1;font-family:var(--f-disp);font-size:21px;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.2}
.sh-f{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sh-f .btn{flex:1}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sec-h button{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--accent-fg)}
.kv{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted);font-size:14px}
.kv span:last-child{font-weight:600;text-align:right;overflow-wrap:anywhere}
.copy{font-size:12px;font-weight:700;color:var(--accent-fg);margin-left:8px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 70px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
@media (min-width:900px){#toasts{left:216px;bottom:84px}}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:550;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:480px;animation:up .2s}
.toast button{font-weight:700;color:var(--hero-num);white-space:nowrap}

/* AI */
.chat{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.msg-q{align-self:flex-end;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:85%;font-weight:550}
.msg-a{background:var(--surface);border-radius:16px 16px 16px 4px;padding:14px;max-width:100%}
.msg-a h3{font-size:14px;margin:10px 0 4px}
.msg-a h3:first-child{margin-top:0}
.msg-a p{margin:0 0 6px}
.aiform{display:flex;gap:8px;position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 70px);z-index:5}
@media (min-width:900px){.aiform{bottom:84px}}
.aiform input{flex:1;box-shadow:var(--shadow)}

/* ----- text rules: links, inbox suggestions, meeting actions ----- */
const STOP=['ltd','limited','first','second','fix','level','works','area','group','services','the','and','pool','hall'];
function stemRe(tok){const t=tok.toLowerCase();return t.length>=5?new RegExp('\\b'+t.slice(0,5).replace(/[^a-z0-9&]/g,'')):new RegExp('\\b'+t.replace(/[^a-z0-9&]/g,'')+'\\b')}
function guessLinks(text){
  const low=String(text||'').toLowerCase();let con=null;
  for(const c of P('contractors')){
    const words=(c.company+' '+(c.package||'')).split(/[^A-Za-z0-9&]+/).filter(w=>w&&!STOP.includes(w.toLowerCase())&&(w.length>=4||/[A-Z&]{3}/.test(w)));
    if(words.some(w=>stemRe(w).test(low))){con=c;break}
  }
  let act=null;
  if(con)act=P('activities').find(a=>a.contractorId===con.id&&a.status!=='Complete')||null;
  if(!act){let best=0;P('activities').forEach(a=>{const n=a.name.split(/\s+/).filter(w=>w.length>=5&&!STOP.includes(w.toLowerCase())).filter(w=>stemRe(w).test(low)).length;if(n>best){best=n;act=a}})}
  return {contractorId:con?con.id:'',activityId:act?act.id:''};
}
function classify(text,kind){
  const low=String(text||'').toLowerCase(),s=[];
  const risk=/(reduc|behind|delay|late\b|shortage|slip|cancel|not started|stoppage|down to|short of|overrun)/.exec(low);
  const cons=/(access|approval|approve|design|information|material|awaiting|waiting|not released|release|permit|drawing|instruction|outstanding)/.exec(low);
  const task=/(chase|submit|send|confirm|arrange|order|check|review|need|must|call|email|provide|book|update|prepare)/.exec(low);
  if(risk)s.push({k:'risk',why:'Mentions "'+risk[1]+'", which can threaten the programme'});
  if(task)s.push({k:'task',why:'Reads like an action ("'+task[1]+'")'});
  if(cons)s.push({k:'constraint',why:'Mentions "'+cons[1]+'", which can block work'});
  if(kind==='photo'){s.unshift({k:'diary',why:'Photos are kept as site evidence'})}
  if(!s.length)s.push({k:'task',why:'No clear signal, so a task is the safest default'});
  if(!s.some(x=>x.k==='note'))s.push({k:'note',why:''});
  return s;
}
function extractActions(text){
  const lines=String(text||'').split(/\n+|(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>6);
  const out=[];
  lines.forEach(l=>{
    const low=l.toLowerCase();let kind=null;
    if(/(outstanding|awaiting|waiting|pending|approval|tbc|to be confirmed)/.test(low))kind='waiting';
    else if(/(submit|send|provide|confirm|chase|issue|arrange|review|update|prepare|check|agree|order|need|must|required)/.test(low))kind='action';
    else if(/(reduc|behind|delay|late\b|shortage|slip|not started)/.test(low))kind='risk';
    if(!kind)return;
    const links=guessLinks(l);const clean=l.replace(/[.!?]+$/,'');
    let due=null;const dw=/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*/.exec(low);
    if(/\btoday\b/.test(low))due=today();else if(/\btomorrow\b/.test(low))due=addDays(today(),1);
    else if(dw)due=nextDow(['sun','mon','tue','wed','thu','fri','sat'].indexOf(dw[1]));
    else due=nextDow(5);
    const owner=links.contractorId?conName(links.contractorId):/\bclient\b/.test(low)?'Client':/\b(architect|designer)\b/.test(low)?'Architect':'';
    out.push({title:kind==='waiting'?'Chase: '+clean:kind==='risk'?'Confirm impact: '+clean:cap1(clean),status:kind==='waiting'?'Waiting':'Open',priority:kind==='risk'?'High':'Medium',due,owner,contractorId:links.contractorId,activityId:links.activityId,on:true})
  });
  return out;
}

function searchAll(q){

    ['progress','issues','observations'].forEach(k=>{if(dd[k])ans.blocks.push({h:cap1(k),p:dd[k]})});
    ans.why='Compiled from today\'s notes, captures, completed tasks and active activities. Nothing is saved until you approve it.';ans.diary=true;return ans}
  if(/focus|today|priorit|first/.test(low)){

  const r=searchAll(q).slice(0,6);

  ans.blocks.push({h:'I can help with',p:'Try: What should I focus on today? What threatens completion? Which contractors need chasing? Which tasks are overdue? What activities start next week? Summarise my risks. Create a 2 week lookahead.'});
  ans.why='I answer from your project data. Ask about tasks, activities, risks, contractors or the diary.';return ans;
}

let sw=null,swiped=false;
document.addEventListener('pointerdown',e=>{
  const fg=e.target.closest&&e.target.closest('.trow-fg');if(!fg||e.target.closest('.chk'))return;
  sw={fg,x:e.clientX,y:e.clientY,dx:0,drag:false,id:fg.parentElement.dataset.id};
  sw.t=setTimeout(()=>{if(sw&&!sw.drag){const id=sw.id;sw=null;swiped=true;setTimeout(()=>{swiped=false},700);taskForm(id)}},560);
});
document.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){sw.drag=true;clearTimeout(sw.t);sw.fg.style.transition='none';try{sw.fg.setPointerCapture(e.pointerId)}catch(_){}}
    else if(Math.abs(dy)>10){clearTimeout(sw.t);sw=null;return}}
  if(sw.drag){sw.dx=dx;sw.fg.style.transform='translateX('+dx+'px)';sw.fg.parentElement.dataset.dir=dx>0?'r':'l'}
});
function endSwipe(){
  if(!sw)return;clearTimeout(sw.t);const s=sw;sw=null;
  if(s.drag){swiped=true;setTimeout(()=>{swiped=false},120);s.fg.style.transition='';s.fg.style.transform='';s.fg.parentElement.dataset.dir='';
    if(s.dx>90)completeTask(s.id);else if(s.dx<-90)postponeTask(s.id)}
}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);

/* ----- Tasks ----- */
function tasksFor(v){
  const T=today(),ts=P('tasks');
  if(v==='completed')return ts.filter(t=>t.status==='Complete').sort((a,b)=>(a.completedAt||'')<(b.completedAt||'')?1:-1).slice(0,60);
  const open=ts.filter(t=>t.status!=='Complete');
  if(v==='waiting')return open.filter(t=>t.status==='Waiting').sort(taskSort);
  const act=open.filter(t=>t.status!=='Waiting');
  if(v==='today')return act.filter(t=>t.due&&t.due<=T).sort(taskSort);
  if(v==='tomorrow')return act.filter(t=>t.due===addDays(T,1)).sort(taskSort);
  return act.filter(t=>!t.due||(t.due>=T&&t.due<=addDays(T,6))||t.due<T).sort(taskSort);
}
function viewTasks(){
  const T=today(),v=V.tasks;
  const segs=[['today','Today'],['tomorrow','Tomorrow'],['week','This week'],['waiting','Waiting for'],['completed','Completed']].map(a=>({k:a[0],l:a[1],n:a[0]==='completed'?undefined:tasksFor(a[0]).length}));
  let o='<h1 class="scr-title">Tasks</h1>'+segHTML([{k:'list',l:'List'},{k:'board',l:'Board'},{k:'cal',l:'Calendar'}],V.tmode,'tmode');
  if(V.tmode==='cal')return o+calView();
  if(V.tmode==='board')return o+quickAddHTML('Add a task and press Enter')+boardView();
  o+=segHTML(segs,v,'taskTab');
  o+=quickAddHTML(v==='waiting'?'Add something you are waiting for':'Add a task and press Enter');
  const list=tasksFor(v);
  if(!list.length)return o+emptyBig(v==='completed'?'No completed tasks yet':v==='waiting'?'Nothing waiting':'Nothing here','Swipe right to complete, swipe left to postpone, press and hold to edit.');
  if(v==='today'){const od=list.filter(t=>t.due<T),td=list.filter(t=>t.due===T);
    if(od.length)o+='<div class="grp crit">Overdue <span>'+od.length+'</span></div>'+od.map(t=>taskRow(t)).join('');
    if(td.length)o+='<div class="grp">Today <span>'+td.length+'</span></div>'+td.map(t=>taskRow(t)).join('')}
  else if(v==='week'){const gs={};list.forEach(t=>{const k=!t.due?'none':t.due<T?'over':t.due;(gs[k]=gs[k]||[]).push(t)});
    if(gs.over)o+='<div class="grp crit">Overdue <span>'+gs.over.length+'</span></div>'+gs.over.map(t=>taskRow(t)).join('');
    Object.keys(gs).filter(k=>k!=='over'&&k!=='none').sort().forEach(k=>{o+='<div class="grp">'+esc(k===T?'Today':k===addDays(T,1)?'Tomorrow':fmt(k))+'</div>'+gs[k].map(t=>taskRow(t)).join('')});
    if(gs.none)o+='<div class="grp">No date</div>'+gs.none.map(t=>taskRow(t)).join('')}
  else o+=list.map(t=>taskRow(t,true)).join('');
  return o;
}

/* ----- Programme ----- */
function viewProg(){
  const segs=[['look2','2 week'],['look6','6 week'],['miles','Milestones'],['cal','Calendar'],['acts','Activities'],['cons','Contractors'],['risks','Risks'],['constr','Constraints']].map(a=>({k:a[0],l:a[1]}));

  return o+m();
}
function lookView(days){
  const gs=lookahead(days),T=today();
  if(!gs.length)return emptyBig('No activities in the next '+days/7+' weeks',P('activities').length?'Everything is complete or starts later.':'Import your programme and the lookahead builds itself.',can('manage')?'<button class="btn" data-act="importProg">Import programme</button>':'');
  const all=gs.flatMap(g=>g.items),bl=all.filter(a=>lookState(a).tone==='crit').length,ar=all.filter(a=>lookState(a).tone==='warn').length;
  let o='<div class="stat-row"><div class="stat"><b>'+all.length+'</b><span>Activities</span></div><div class="stat crit"><b>'+bl+'</b><span>Blocked</span></div><div class="stat warn"><b>'+ar+'</b><span>At risk</span></div><div class="stat ok"><b>'+(all.length-bl-ar)+'</b><span>Ready</span></div></div>';
  o+='<div class="tools"><button class="btn ghost sm" data-act="copyLook" data-k="'+days+'">'+ic('copy',16)+' Copy as text</button></div>';
  gs.forEach(g=>{o+='<div class="wk">Week commencing '+esc(fmt(g.wc))+(g.wc===mondayOf(T)?'<small>This week</small>':'')+'</div>'+g.items.map(a=>{const s=lookState(a),c=byId('contractors',a.contractorId),cs=P('constraints').filter(x=>x.activityId===a.id&&x.status!=='Green').length;
    return '<button class="lc" data-act="openAct" data-id="'+a.id+'"><div class="h"><b>'+esc(a.name)+'</b>'+pill(s.l,s.tone)+'</div><div class="meta"><span class="mt tnum">'+esc(fmtS(a.start))+' to '+esc(fmtS(a.finish))+'</span>'+(c?'<span class="mt">'+esc(c.company)+'</span>':'')+(c&&c.labour?'<span class="mt">'+c.labour+' operatives</span>':c?'<span class="mt warn">No labour forecast</span>':'')+(cs?'<span class="mt">'+cs+' constraint'+(cs>1?'s':'')+' open</span>':'')+'</div></button>'}).join('')});
  return o;
}
function milesView(){
  const ms=P('milestones').slice().sort((a,b)=>a.date<b.date?-1:1);
  let o='<div class="tools">'+(can('manage')?'<button class="btn sm" data-act="newMile">'+ic('plus',16)+' Add milestone</button>':'')+'</div>';

function actsView(){

function consView(){
  const cs=P('contractors').slice().sort((a,b)=>a.company<b.company?-1:1);
  let o='<div class="tools">'+(can('manage')?'<button class="btn sm" data-act="newContractor">'+ic('plus',16)+' Add contractor</button>':'')+'</div>';
  if(!cs.length)return o+emptyBig('No contractors yet','Add subcontractors to track their tasks, risks and labour.');
  return o+cs.map(c=>{const ts=openTasks().filter(t=>t.contractorId===c.id),od=ts.filter(isOverdue).length,ac=P('activities').filter(a=>a.contractorId===c.id&&a.status!=='Complete').length,rk=P('risks').filter(r=>r.contractorId===c.id&&(r.status==='Open'||r.status==='Monitoring')).length;
    return '<button class="lc" data-act="openCon" data-id="'+c.id+'"><div class="h"><b>'+esc(c.company)+'</b>'+(od?pill(od+' overdue','crit'):'')+'</div><div class="meta"><span class="mt">'+esc(c.package||'')+'</span></div><div class="meta"><span class="mt">'+ts.length+' open task'+(ts.length===1?'':'s')+'</span><span class="mt">'+ac+' activit'+(ac===1?'y':'ies')+'</span><span class="mt">'+rk+' risk'+(rk===1?'':'s')+'</span>'+(c.labour?'<span class="mt">'+c.labour+' operatives</span>':'<span class="mt warn">No labour forecast</span>')+'</div></button>'}).join('');
}
function risksView(){
  const rs=P('risks'),f=V.riskF;const cnt=s=>rs.filter(r=>r.status===s).length;
  let o='<div class="stat-row">'+RSTAT.map(s=>'<div class="stat"><b>'+cnt(s)+'</b><span>'+s+'</span></div>').join('')+'</div><div class="tools"><button class="btn sm" data-act="newRisk">'+ic('plus',16)+' Log risk</button></div>';
  o+='<div class="chiprow" style="margin-bottom:12px">'+['Open','Monitoring','Mitigated','Closed','All'].map(x=>'<button class="'+(f===x?'on':'')+'" data-act="riskF" data-k="'+x+'">'+x+'</button>').join('')+'</div>';
  const list=rs.filter(r=>f==='All'||r.status===f).sort((a,b)=>PRI[b.impact]-PRI[a.impact]);
  if(!list.length)return o+emptyBig('No '+(f==='All'?'':f.toLowerCase()+' ')+'risks','Log threats to delivery so they stay visible.');
  return o+list.map(riskRow).join('');
}
function constrView(){
  const cs=P('constraints'),f=V.consF;
  let o='<div class="stat-row"><div class="stat crit"><b>'+cs.filter(c=>c.status==='Red').length+'</b><span>Red, blocked</span></div><div class="stat warn"><b>'+cs.filter(c=>c.status==='Amber').length+'</b><span>Amber, at risk</span></div><div class="stat ok"><b>'+cs.filter(c=>c.status==='Green').length+'</b><span>Green, clear</span></div></div><div class="tools"><button class="btn sm" data-act="newCons">'+ic('plus',16)+' Add constraint</button></div>';
  o+='<div class="chiprow" style="margin-bottom:12px">'+['All','Red','Amber','Green'].map(x=>'<button class="'+(f===x?'on':'')+'" data-act="consF" data-k="'+x+'">'+x+'</button>').join('')+'</div>';
  const list=cs.filter(c=>f==='All'||c.status===f).sort((a,b)=>CSTAT.indexOf(b.status)-CSTAT.indexOf(a.status));
  if(!list.length)return o+emptyBig('No constraints','Log blockers against activities so they are seen early.');
  return o+list.map(conRow).join('');
}

/* ----- Notes, diary, meetings ----- */
function viewNotes(){
  let o='<h1 class="scr-title">Notes</h1>'+segHTML([{k:'notes',l:'Notes',n:P('notes').length},{k:'diary',l:'Daily diary',n:P('diary').length},{k:'meet',l:'Meetings',n:P('meetings').length}],V.notes,'notesTab');
  if(V.notes==='diary')return o+diaryView();
  if(V.notes==='meet')return o+meetView();
  const ns=P('notes').slice().sort((a,b)=>a.created<b.created?1:-1),f=V.noteF;
  o+='<div class="tools"><button class="btn sm" data-act="newNote">'+ic('plus',16)+' New note</button></div><div class="chiprow" style="margin-bottom:12px">'+['All'].concat(NTYPES).map(x=>'<button class="'+(f===x?'on':'')+'" data-act="noteF" data-k="'+x+'">'+x+'</button>').join('')+'</div>';
  const list=ns.filter(n=>f==='All'||n.type===f);
  return o+(list.length?list.map(noteCard).join(''):emptyBig('No notes','Write it down, attach a photo or a voice note. Link it to an activity later.'));
}
function diaryView(){
  const ds=P('diary').slice().sort((a,b)=>a.date<b.date?1:-1),T=today(),has=ds.some(d=>d.date===T);
  let o='<div class="tools"><button class="btn sm" data-act="genDiary">'+ic('spark',16)+' '+(has?'Open today':'Generate today\'s diary')+'</button><button class="btn ghost sm" data-act="copySummary">'+ic('copy',16)+' Copy summary</button><button class="btn ghost sm" data-act="newDiary">'+ic('plus',16)+' New entry</button></div>';
  if(!ds.length)return o+emptyBig('No diary entries','Capture through the day, then generate the diary at 16:30 and approve it.');
  return o+ds.map(d=>'<button class="lc" data-act="openDiary" data-id="'+d.id+'"><div class="h"><b>'+esc(fmtL(d.date))+'</b>'+pill(d.weather||'No weather')+'</div><p>'+esc(clip((d.progress||'')+' '+(d.issues||''),180)||'No text')+'</p><div class="meta">'+(d.labour?'<span class="mt">'+esc(d.labour)+' operatives</span>':'')+((d.photos||[]).length?'<span class="mt">'+d.photos.length+' photo'+(d.photos.length>1?'s':'')+'</span>':'')+'</div></button>').join('');
}
function meetView(){
  const ms=P('meetings').slice().sort((a,b)=>a.date<b.date?1:-1);
  let o='<div class="tools"><button class="btn sm" data-act="newMeet">'+ic('plus',16)+' New meeting</button></div>';
  if(!ms.length)return o+emptyBig('No meetings','Take notes in the meeting, then generate actions and approve the ones you want.');
  return o+ms.map(m=>'<button class="lc" data-act="openMeet" data-id="'+m.id+'"><div class="h"><b>'+esc(m.title||m.type+' meeting')+'</b>'+pill(m.type)+'</div><div class="meta"><span class="mt">'+esc(fmtL(m.date))+'</span>'+(m.actionsAdded?'<span class="mt ok">'+m.actionsAdded+' actions added</span>':'')+'</div></button>').join('');
}

/* ----- AI ----- */
function viewAI(){
  const prompts=['What should I focus on today?','What threatens completion?','Which contractors need chasing?','Which tasks are overdue?','What activities start next week?','Summarise my risks','Create a 2 week lookahead','Summarise today\'s diary'];
  let o='<h1 class="scr-title">Project assistant</h1><p class="sub" style="margin:-6px 0 14px">Answers come from your project data. It suggests and explains, and never changes anything until you tap.</p>';
  o+='<div class="chat">'+V.ai.map((m,i)=>aiMsg(m,i)).join('')+'</div>';
  if(!V.ai.length)o+='<div class="chiprow" style="margin-bottom:14px">'+prompts.map(p=>'<button data-act="askAI" data-q="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div><p class="hint">This prototype answers with fixed rules over your data. A full build connects it to a language model.</p>';
  else o+='<div class="chiprow" style="margin-bottom:14px">'+prompts.slice(0,5).map(p=>'<button data-act="askAI" data-q="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>';
  o+='<form class="aiform" id="aiForm" onsubmit="return false"><input id="aiQ" type="text" placeholder="Ask about your project" aria-label="Ask a question" autocomplete="off"><button class="btn" data-act="askSend" aria-label="Send">'+ic('send',18)+'</button></form>';
  return o;
}
function aiMsg(m,i){
  const a=m.a;
  let h='<div class="msg-q">'+esc(m.q)+'</div><div class="msg-a">';
  a.blocks.forEach(b=>{h+=(b.h?'<h3>'+esc(b.h)+'</h3>':'')+(b.p?'<p style="white-space:pre-line">'+esc(b.p)+'</p>':'');if(b.items&&b.items.length)h+=b.items.map(x=>'<button class="li" data-act="openItem" data-kind="'+x.kind+'" data-id="'+x.id+'"><span class="m"><span class="t" style="font-weight:550">'+esc(x.text)+'</span></span>'+ic('chev',16)+'</button>').join('')});
  if(a.sugs&&a.sugs.length)h+='<div class="sugs">'+a.sugs.map((s,k)=>'<button class="sug ai" data-act="aiSug" data-i="'+i+'" data-k="'+k+'">'+ic('plus',14)+esc(s.l)+'</button>').join('')+'</div>';
  if(a.look)h+='<div class="sugs"><button class="sug" data-act="tab" data-k="prog" data-sub="'+(a.look===14?'look2':'look6')+'">Open lookahead</button><button class="sug" data-act="copyLook" data-k="'+a.look+'">Copy as text</button></div>';
  if(a.diary)h+='<div class="sugs"><button class="sug ai" data-act="genDiary">Review and approve diary</button></div>';
  if(a.why)h+='<div class="srcs"><b>Why:</b> '+esc(a.why)+' Tap an item to see its source.</div>';
  return h+'</div>';
}

/* ----- Welcome ----- */
function renderWelcome(){
  let w=$('#welcome');if(!w){w=document.createElement('div');w.id='welcome';w.className='welcome';document.body.appendChild(w)}
  w.hidden=false;
  const back=S.profile&&!S.signedIn;
  if(back){w.innerHTML='<div class="welcome-in"><div class="logo"><span class="mark">'+ic('check',18)+'</span>Shift</div><h1>Welcome back, '+esc(S.profile.name.split(' ')[0])+'</h1><p class="lead">Your projects are saved on this device.</p><button class="btn full" data-act="signIn">Continue</button><p style="margin-top:14px"><button class="hint" style="text-decoration:underline" data-act="switchAccount">Use a different account (clears data on this device)</button></p></div>';return}
  w.innerHTML='<div class="welcome-in"><div class="logo"><span class="mark">'+ic('check',18)+'</span>Shift</div><h1>Run your whole day on site from one place.</h1><p class="lead">Tasks, notes, programme, risks and the site diary, with the three things that matter today at the top.</p>'+
   '<div class="fld"><label for="w_name">Your name *</label><input id="w_name" type="text" placeholder="Daniel Woodgate" autocomplete="name"></div>'+
   '<div class="fld"><label for="w_email">Email</label><input id="w_email" type="text" inputmode="email" placeholder="you@company.co.uk" autocomplete="email"></div>'+
   '<div class="fld"><label for="w_role">Your role</label><select id="w_role">'+ROLES.map(r=>'<option'+(r==='Project Manager'?' selected':'')+'>'+r+'</option>').join('')+'</select></div>'+
   '<div class="sh-f" style="flex-direction:column"><button class="btn full" data-act="startOwn">Set up my project</button><button class="btn ghost full" data-act="startSample">Look around with an example project</button></div>'+
   '<p class="hint" style="margin-top:14px">Your data stays in this browser. Sign-in with Microsoft, Google or Apple and sync across devices need the full build.</p></div>';
}

/* ===== board (kanban) and calendar views ===== */
function quickAddHTML(ph){return '<div class="qa"><input id="quickAdd" type="text" placeholder="'+esc(ph)+'" aria-label="New task title" autocomplete="off"><button class="btn" data-act="quickAdd" aria-label="Add task">'+ic('plus',20)+'</button></div>'}

const BOARD_COLS=[['Open','Open'],['In Progress','In progress'],['Waiting','Waiting for'],['Complete','Done']];
function boardView(){
  const T=today(),ts=P('tasks'),w0=addDays(T,-7);
  const items=s=>ts.filter(t=>t.status===s&&(s!=='Complete'||(t.completedAt&&iso(new Date(t.completedAt))>=w0))).sort(s==='Complete'?(a,b)=>(a.completedAt<b.completedAt?1:-1):taskSort);
  return '<div class="board">'+BOARD_COLS.map((c,ci)=>{const l=items(c[0]);
    return '<section class="col" data-status="'+c[0]+'" aria-label="'+c[1]+'"><div class="col-h"><b>'+c[1]+'</b><span class="ct">'+l.length+'</span></div><div class="col-b">'+(l.length?l.map(t=>kcard(t,ci)).join(''):'<div class="col-e">Nothing here</div>')+'</div></section>'}).join('')+
    '</div><p class="hint" style="margin-top:10px">Drag a card by its handle, or use the arrows, to change its status. Done shows the last 7 days.</p>';
}
function kcard(t,ci){
  const last=BOARD_COLS.length-1;
  return '<article class="kc'+(isOverdue(t)?' od':'')+'" data-id="'+t.id+'"><div class="kc-t" data-act="openTask" data-id="'+t.id+'">'+esc(t.title)+'</div>'+taskMeta(t,false)+
   '<div class="kc-f"><button class="kb" data-act="moveTask" data-id="'+t.id+'" data-d="-1"'+(ci===0?' disabled':'')+' aria-label="Move left">'+ic('back',16)+'</button><button class="kb kg" data-grip aria-label="Drag to another column">'+ic('grip',18)+'</button><button class="kb" data-act="moveTask" data-id="'+t.id+'" data-d="1"'+(ci===last?' disabled':'')+' aria-label="Move right">'+ic('chev',16)+'</button></div></article>';
}
function setTaskStatus(id,s){
  if(!guard('create'))return;const t=byId('tasks',id);if(!t||t.status===s)return;
  const prev={status:t.status,completedAt:t.completedAt||''};t.status=s;fixTask(t);commit();
  const lab=(BOARD_COLS.find(c=>c[0]===s)||[0,s])[1];
  toast('Moved to '+lab,{l:'Undo',fn:()=>{t.status=prev.status;t.completedAt=prev.completedAt;commit()}});
}

function calEvents(d){
  const own=k=>P(k);
  return {
    tasks:own('tasks').filter(t=>t.due===d).sort(taskSort),
    starts:own('activities').filter(a=>a.start===d&&a.start!==a.finish),
    ends:own('activities').filter(a=>a.finish===d&&a.start!==a.finish),
    miles:own('milestones').filter(m=>m.date===d),
    cons:own('constraints').filter(c=>c.due===d&&c.status!=='Green'),
    meets:own('meetings').filter(m=>m.date===d),
    diary:own('diary').filter(x=>x.date===d),
    running:own('activities').filter(a=>a.start<d&&a.finish>d&&a.status!=='Complete')
  };
}
function calView(){
  const T=today();
  if(!V.calM)V.calM=T.slice(0,7)+'-01';
  if(!V.calD)V.calD=T;
  const first=V.calM,start=mondayOf(first);
  const label=parse(first).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return '<div class="cal-h"><button class="ibtn" data-act="calPrev" aria-label="Previous month">'+ic('back',18)+'</button><b>'+label+'</b><button class="ibtn" data-act="calNext" aria-label="Next month">'+ic('chev',18)+'</button></div>'+
   '<div class="cal"><div class="cal-w"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="cal-g">'+
   Array.from({length:42},(_,i)=>{
     const d=addDays(start,i),m=parse(d).getMonth()===parse(first).getMonth(),ev=calEvents(d);
     const dots=[ev.tasks.length?'<i class="cdot k-task'+(ev.tasks.some(x=>x.priority==='Critical'||x.priority==='High')?' late':'')+'"></i>':'',
      ev.starts.length||ev.ends.length||ev.running.length?'<i class="cdot k-act"></i>':'',
      ev.miles.length?'<i class="cdot k-mile"></i>':'',
      ev.cons.length?'<i class="cdot k-cons"></i>':'',
      ev.meets.length?'<i class="cdot k-meet"></i>':''].join('');
     return '<button class="cd'+(m?'':' out')+(d===T?' today':'')+(d===V.calD?' sel':'')+'" data-act="calDay" data-d="'+d+'"><span class="dn">'+parse(d).getDate()+'</span><div class="dots">'+dots+'</div></button>'
   }).join('')+'</div></div>'+
   '<div class="legend"><span><i class="cdot k-task"></i> Task</span><span><i class="cdot k-act"></i> Activity</span><span><i class="cdot k-cons"></i> Constraint</span><span><i class="cdot k-mile"></i> Milestone</span></div>'+
   '<div class="sec-h" style="margin-top:20px">'+fmt(V.calD)+'</div>'+
   calDayItems(V.calD);
}
function calDayItems(d){
  const ev=calEvents(d);let o='';
  if(ev.diary.length)o+=ev.diary.map(x=>'<button class="lc" data-act="openDiary" data-id="'+x.id+'"><div class="h"><b>Diary entry</b>'+pill(x.weather||'')+'</div></button>').join('');
  if(ev.meets.length)o+=ev.meets.map(x=>'<button class="lc" data-act="openMeet" data-id="'+x.id+'"><div class="h"><b>'+esc(x.title||x.type+' meeting')+'</b></div></button>').join('');
  if(ev.miles.length)o+=ev.miles.map(x=>'<button class="lc" data-act="openMile" data-id="'+x.id+'"><div class="h"><b>'+esc(x.name)+'</b>'+pill('Milestone')+'</div></button>').join('');
  if(ev.cons.length)o+=ev.cons.map(x=>conRow(x)).join('');
  if(ev.starts.length)o+=ev.starts.map(x=>'<button class="lc" data-act="openAct" data-id="'+x.id+'"><div class="h"><b>'+esc(x.name)+'</b>'+pill('Starts today','accent')+'</div></button>').join('');
  if(ev.ends.length)o+=ev.ends.map(x=>'<button class="lc" data-act="openAct" data-id="'+x.id+'"><div class="h"><b>'+esc(x.name)+'</b>'+pill('Finishes today','warn')+'</div></button>').join('');
  if(ev.tasks.length)o+=ev.tasks.map(x=>taskRow(x)).join('');
  return o||'<div class="empty">Nothing scheduled.</div>';
}

/* ----- boot ----- */
async function boot(){
  S = await loadState();
  $('.cap').innerHTML=[['task','plus','Task'],['note','notes','Note'],['photo','camera','Photo'],['voice','mic','Voice']].map(c=>'<button data-act="cap" data-k="'+c[0]+'" aria-label="Capture '+c[2].toLowerCase()+'"'+(c[0]==='task'?' class="tk"':'')+'>'+ic(c[1],18)+'<span>'+c[2]+'</span></button>').join('');
  $('#side-brand').innerHTML='<span class="mark">'+ic('check',16)+'</span>Shift';
  render();
  initMedia();
}
boot();
})();
</script>
</body>
