<title>Shift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column with a docked capture pill and bottom nav; at 900px+ the nav becomes a left rail. */
:root{
  --bg:#ffffff; --surface:#F4F6FA; --surface-2:#E9EEF5; --line:#E0E6EE;
  --fg:#0D1B34; --muted:#56647E;
  --primary:#0F2747; --on-primary:#ffffff;
  --accent:#0B8A8A; --accent-soft:#DDF2F1; --accent-fg:#066464;
  --hero-bg:#0F2747; --hero-fg:#ffffff; --hero-mute:#A9BAD6; --hero-line:rgba(255,255,255,.16); --hero-num:#5ED6CF;
  --ok:#17804F; --ok-soft:#DFF3E8; --warn:#A86500; --warn-soft:#FFF0D2; --crit:#C42F29; --crit-soft:#FCE3E1;
  --shadow:0 1px 2px rgba(13,27,52,.06),0 8px 24px rgba(13,27,52,.07);
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --r:16px; --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#111D31; --surface-2:#192843; --line:#223250;
  --fg:#E7ECF5; --muted:#9AA9C1;
  --primary:#3DC2BC; --on-primary:#06222A;
  --accent:#3DC2BC; --accent-soft:#123539; --accent-fg:#7BE0DA;
  --hero-bg:#13294A; --hero-fg:#F2F6FC; --hero-mute:#9FB2D2; --hero-line:rgba(255,255,255,.14); --hero-num:#5ED6CF;
  --ok:#4CC88A; --ok-soft:#113022; --warn:#F0B34A; --warn-soft:#38290F; --crit:#FF8078; --crit-soft:#3C1A1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#111D31; --surface-2:#192843; --line:#223250;
  --fg:#E7ECF5; --muted:#9AA9C1;
  --primary:#3DC2BC; --on-primary:#06222A;
  --accent:#3DC2BC; --accent-soft:#123539; --accent-fg:#7BE0DA;
  --hero-bg:#13294A; --hero-fg:#F2F6FC; --hero-mute:#9FB2D2; --hero-line:rgba(255,255,255,.14); --hero-num:#5ED6CF;
  --ok:#4CC88A; --ok-soft:#113022; --warn:#F0B34A; --warn-soft:#38290F; --crit:#FF8078; --crit-soft:#3C1A1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.mute{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
#main{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 190px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid transparent}
.proj{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:6px 10px;border-radius:12px;margin-left:-10px}
.proj:hover{background:var(--surface)}
.proj-n{font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.ibtn:hover{background:var(--surface)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-style:normal}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:13px;display:grid;place-items:center}
.net{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.scr-title{font-family:var(--f-disp);font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:8px 0 14px;text-wrap:balance}
.hello{font-family:var(--f-disp);font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:10px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.sec-gap{display:flex;flex-direction:column;gap:14px}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.nv.on{color:var(--accent-fg)}
.nv.on .ic{stroke-width:2.3}
.nv .badge{top:2px;right:calc(50% - 22px)}
.capwrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:25;display:flex;justify-content:center;pointer-events:none;padding-inline:max(12px,env(safe-area-inset-left,0px))}
.cap{pointer-events:auto;display:flex;gap:2px;background:var(--primary);color:var(--on-primary);border-radius:99px;padding:5px;box-shadow:var(--shadow),0 10px 30px rgba(13,27,52,.25)}
.cap button{display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;border-radius:99px;font-weight:600;font-size:14px;color:inherit}
.cap button:hover{background:rgba(255,255,255,.14)}
.cap .tk{background:rgba(255,255,255,.16)}
@media (max-width:380px){.cap button{padding:0 10px;font-size:13px}}
@media (min-width:900px){
  #nav{top:0;right:auto;width:216px;grid-template-columns:1fr;align-content:start;gap:2px;border-top:0;border-right:1px solid var(--line);padding:calc(76px + env(safe-area-inset-top,0px)) 12px 12px}
  .nv{flex-direction:row;gap:12px;padding:11px 12px;font-size:15px;justify-content:flex-start}
  .nv .badge{position:static;margin-left:auto}
  #main{margin-left:232px;margin-right:auto;padding-bottom:120px}
  .capwrap{left:216px;bottom:20px}
  #side-brand{display:flex}
}
#side-brand{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;width:216px;z-index:31;padding:20px 24px;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.03em;align-items:center;gap:8px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary)}

/* segmented tabs */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg .n{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}

/* cards & widgets */
.card{background:var(--surface);border-radius:var(--r);padding:14px}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:16px 16px 6px;box-shadow:var(--shadow)}
.hero h2{font-family:var(--f-disp);font-size:15px;font-weight:600;color:var(--hero-mute);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--hero-line);width:100%;text-align:left;color:inherit}
.fi:first-of-type{border-top:0}
.fi .no{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1;color:var(--hero-num);width:20px;flex:none}
.fi b{display:block;font-weight:650;font-size:16px;line-height:1.25}
.fi small{display:block;color:var(--hero-mute);font-size:13px;margin-top:2px}
.fi .ic{margin-left:auto;color:var(--hero-mute);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.wg{background:var(--surface);border-radius:var(--r);padding:14px 14px 6px;min-width:0}
.wg-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.wg-h h2{font-size:15px;font-weight:700}
.wg-h .ct{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 8px}
.wg-h .lnk{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent-fg)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;min-width:0}
.li:first-of-type{border-top:0}
.li .m{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li .ic.cv{color:var(--muted)}
.empty{padding:14px 0 16px;color:var(--muted);font-size:14px}
.empty-big{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-big b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.insight{background:var(--accent-soft);color:var(--accent-fg);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start}
.insight p{color:var(--fg);font-weight:550}
.insight small{display:block;color:var(--accent-fg);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px;margin-bottom:2px}
.notice{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.notice button{margin-left:auto;font-weight:700;color:var(--accent-fg);white-space:nowrap}
.check-li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.accent{background:var(--accent-soft);color:var(--accent-fg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.ok,.dot.Green{background:var(--ok)}.dot.warn,.dot.Amber{background:var(--warn)}.dot.crit,.dot.Red{background:var(--crit)}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:3px}
.mt{font-size:12.5px;color:var(--muted)}
.mt.warn{color:var(--warn);font-weight:650}.mt.crit{color:var(--crit);font-weight:650}.mt.ok{color:var(--ok);font-weight:650}
.pri{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-Low{background:var(--muted);opacity:.5}.p-Medium{background:var(--accent)}.p-High{background:var(--warn)}.p-Critical{background:var(--crit)}

/* tasks */
.trow{position:relative;overflow:hidden;border-radius:12px;margin-bottom:6px;background:var(--surface-2)}
.trow-bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:14px;color:#fff;gap:8px}
.trow-bg.l{background:var(--ok);justify-content:flex-start}
.trow-bg.r{background:var(--warn);justify-content:flex-end}
.trow-bg{visibility:hidden}
.trow[data-dir="r"] .trow-bg.l,.trow[data-dir="l"] .trow-bg.r{visibility:visible}
.trow-fg{position:relative;background:var(--surface);display:flex;gap:12px;align-items:flex-start;padding:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer;border-radius:12px;transition:transform .18s}
.wg .trow-fg{background:var(--bg)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;position:relative}
.chk::after{content:"";position:absolute;inset:-10px}
.chk:hover{border-color:var(--accent);color:var(--accent)}
.chk.done{background:var(--accent);border-color:var(--accent);color:var(--on-primary)}
.chk.p-Critical{border-color:var(--crit)}.chk.p-High{border-color:var(--warn)}.chk.p-Medium{border-color:var(--accent)}
.ttl{font-weight:600;overflow-wrap:anywhere}
.ttl.done{text-decoration:line-through;color:var(--muted)}
.tmain{flex:1;min-width:0}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;gap:8px}
.grp.crit{color:var(--crit)}
.qa{display:flex;gap:8px;margin-bottom:12px}
.qa input{flex:1}

/* generic list cards */
.lc{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:block;width:100%;text-align:left;margin-bottom:8px;min-width:0}
.lc .h{display:flex;gap:8px;align-items:flex-start}
.lc .h b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:650}
.lc p{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.thumbs .x{position:relative}
.thumbs .x button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug{display:inline-flex;gap:5px;align-items:center;padding:7px 12px;border-radius:99px;background:var(--surface-2);font-weight:600;font-size:13px}
.sug.ai{background:var(--accent-soft);color:var(--accent-fg)}
.why{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.crit b{color:var(--crit)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.wk{font-family:var(--f-disp);font-weight:700;font-size:15px;margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.wk small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:650}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.4}
input[type=range]{min-height:30px;padding:0;accent-color:var(--accent)}
input[type=file]{display:none}
.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--crit)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.frow{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chiprow button{padding:8px 14px;border-radius:99px;background:var(--surface-2);font-weight:600;font-size:14px}
.chiprow button.on{background:var(--primary);color:var(--on-primary)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.scrim{position:absolute;inset:0;background:rgba(6,14,28,.5);animation:fade .18s}
.sheet{position:relative;width:100%;max-width:580px;max-height:94%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.wide{max-width:720px}
@media (min-width:900px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-h h2{flex:1;font-family:var(--f-disp);font-size:21px;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.2}
.sh-f{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sh-f .btn{flex:1}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sec-h button{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--accent-fg)}
.kv{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted);font-size:14px}
.kv span:last-child{font-weight:600;text-align:right;overflow-wrap:anywhere}
.copy{font-size:12px;font-weight:700;color:var(--accent-fg);margin-left:8px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 70px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
@media (min-width:900px){#toasts{left:216px;bottom:84px}}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:550;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:480px;animation:up .2s}
.toast button{font-weight:700;color:var(--hero-num);white-space:nowrap}

/* AI */
.chat{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.msg-q{align-self:flex-end;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:85%;font-weight:550}
.msg-a{background:var(--surface);border-radius:16px 16px 16px 4px;padding:14px;max-width:100%}
.msg-a h3{font-size:14px;margin:10px 0 4px}
.msg-a h3:first-child{margin-top:0}
.msg-a p{margin:0 0 6px}
.aiform{display:flex;gap:8px;position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 70px);z-index:5}
@media (min-width:900px){.aiform{bottom:84px}}
.aiform input{flex:1;box-shadow:var(--shadow)}
.srcs{font-size:12.5px;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}

/* welcome */
.welcome{position:fixed;inset:0;z-index:300;background:var(--bg);overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
.welcome-in{max-width:440px;margin:6vh auto 0}
.welcome h1{font-family:var(--f-disp);font-size:38px;line-height:1.05;letter-spacing:-.03em;margin:22px 0 10px;text-wrap:balance}

.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:-.03em}
.logo .mark{width:34px;height:34px;border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,82%);gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
@media (min-width:700px){.board{grid-auto-columns:minmax(0,1fr)}}
.col{background:var(--surface);border-radius:var(--r);padding:10px;scroll-snap-align:start;min-width:0;border:2px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
.col-h b{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.col-h .ct{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 8px}
.col-b{display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-e{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}
.kc{background:var(--bg);border-radius:12px;padding:10px 10px 4px;box-shadow:0 1px 2px rgba(13,27,52,.08)}
.kc.od{box-shadow:inset 3px 0 0 var(--crit),0 1px 2px rgba(13,27,52,.08)}
.kc.dragging{opacity:.35}
.kc.ghost{box-shadow:var(--shadow);transform:rotate(1.5deg);opacity:.95}
.kc-t{font-weight:600;overflow-wrap:anywhere;cursor:pointer}
.kc-f{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.kb{width:40px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.kb:hover:not([disabled]){background:var(--surface-2);color:var(--fg)}
.kb[disabled]{opacity:.3;cursor:default}
.kg{touch-action:none;cursor:grab}

/* calendar */
.cal-h{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.cal-h b{flex:1;font-family:var(--f-disp);font-size:19px;text-align:center}
.cal{background:var(--surface);border-radius:var(--r);padding:8px}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-w span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:4px 0 6px}
.cd{aspect-ratio:1/1.05;min-height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 0;gap:3px;color:var(--fg);position:relative}
.cd:hover{background:var(--surface-2)}
.cd.out{color:var(--muted);opacity:.55}
.cd .dn{font-weight:600;font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cd.today .dn{background:var(--primary);color:var(--on-primary)}
.cd.sel{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:7px}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.k-task{background:var(--accent)}.k-task.late{background:var(--crit)}.k-act{background:var(--fg)}.k-mile{background:var(--warn)}.k-cons{background:var(--crit)}.k-meet{background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* project rail and overview */
.top{flex-wrap:wrap}
.rail{flex:0 0 100%;order:9;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-inline:-2px}
.rail::-webkit-scrollbar{display:none}
.rc{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:99px;background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap;scroll-snap-align:start}
.rc.on{background:var(--primary);color:var(--on-primary)}
.rc.add{padding:0 10px;color:var(--muted)}
.rc .n{font-style:normal;font-size:11.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;background:var(--crit);color:#fff;display:grid;place-items:center;padding:0 5px}

.hd{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.hd.Green{background:var(--ok)}.hd.Amber{background:var(--warn)}.hd.Red{background:var(--crit)}
.rc.on .hd{box-shadow:0 0 0 2px var(--on-primary)}
.ptag{display:inline-block;font-weight:700;font-size:11.5px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.16);color:var(--hero-fg);margin-right:4px}
.li .ptag,.wg .ptag{background:var(--surface-2);color:var(--fg)}
.pc{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px;min-width:0}
.pc:hover{background:var(--surface-2)}
.pc .h{display:flex;gap:8px;align-items:flex-start}
.pc .h b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700;font-size:16px;display:flex;gap:6px;align-items:center}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}
.pstats div{background:var(--bg);border-radius:10px;padding:7px 8px}
.pstats b{display:block;font-family:var(--f-disp);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}

.parse{background:var(--surface);border-radius:12px;padding:10px 12px;margin:-4px 0 12px;font-size:14px}
.parse b{display:block;font-weight:650}

const fmtL=s=>s?parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
const fmtY=s=>s?parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';

function nextDow(dow,from){const T=from||today();let n=(dow-parse(T).getDay()+7)%7;if(n===0)n=7;return addDays(T,n)}
function relDue(s){if(!s)return 'No date';const o=diff(s,today());if(o===0)return 'Today';if(o===1)return 'Tomorrow';if(o===-1)return 'Yesterday';if(o<0)return Math.abs(o)+'d overdue';return fmt(s)}

const PRIOS=['Low','Medium','High','Critical'];const PRI={Low:0,Medium:1,High:2,Critical:3};

/* ----- state ----- */
const KEY='shift.v1';
let S=null;
function blank(){const o={v:1,profile:null,signedIn:false,theme:'auto',cur:null,sample:false,seen:{},autoTasks:true};COLL.forEach(k=>o[k]=[]);return o}

function applySample(){const d=sampleData();COLL.forEach(k=>S[k]=d[k]);S.cur=d.cur;S.sample=true;addSampleProjects()}

/* ----- derived helpers ----- */
const isOverdue=t=>t.status!=='Complete'&&!!t.due&&t.due<today();
const openTasks=()=>P('tasks').filter(t=>t.status!=='Complete');
function taskSort(a,b){return (a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:PRI[b.priority]-PRI[a.priority]}
function waitTone(t){if(!t.due)return 'ok';const o=diff(today(),t.due);return o>=2?'crit':o>=0?'warn':'ok'}
function varianceDays(a){if(a.status==='Complete')return 0;const dur=Math.max(1,diff(a.finish,a.start)),el=diff(today(),a.start);if(el<=0)return 0;const exp=Math.min(100,el/dur*100);return Math.round((exp-(a.progress||0))/100*dur)}
function conTone(aid){const cs=P('constraints').filter(c=>c.activityId===aid);if(cs.some(c=>c.status==='Red'))return 'Red';if(cs.some(c=>c.status==='Amber'))return 'Amber';return cs.length?'Green':''}
const actTasks=aid=>P('tasks').filter(t=>t.activityId===aid);
function dayOfProject(p){const tot=diff(p.end,p.start)+1,n=Math.max(0,Math.min(tot,diff(today(),p.start)+1));return {n,tot}}

function focusItems(){
  const T=today(),out=[];
  P('constraints').filter(c=>c.status==='Red').forEach(c=>out.push({key:'c'+c.id,kind:'constraints',id:c.id,title:'Unblock: '+c.title,why:'Red constraint'+(c.activityId?' on '+actName(c.activityId):''),score:80+(c.due&&c.due<=T?5:0)}));
  P('risks').filter(r=>r.status==='Open'&&r.impact==='High').forEach(r=>out.push({key:'r'+r.id,kind:'risks',id:r.id,title:r.title,why:'Open high-impact risk'+(r.activityId?' on '+actName(r.activityId):''),score:70}));
  P('tasks').forEach(t=>{if(t.status==='Complete')return;const o=t.due?diff(T,t.due):-99;
    if(t.status==='Waiting'&&o>=0)out.push({key:'t'+t.id,kind:'tasks',id:t.id,title:'Chase: '+t.title,why:'Waiting on '+(t.expectedFrom||'someone')+(o>0?', '+o+' day'+(o>1?'s':'')+' overdue':', due today'),score:58+Math.min(o,10)});
    else if(t.status!=='Waiting'&&o>0)out.push({key:'t'+t.id,kind:'tasks',id:t.id,title:t.title,why:o+' day'+(o>1?'s':'')+' overdue, '+t.priority.toLowerCase()+' priority',score:60+PRI[t.priority]*5+Math.min(o,10)});
    else if(t.status!=='Waiting'&&o===0&&PRI[t.priority]>=2)out.push({key:'t'+t.id,kind:'tasks',id:t.id,title:t.title,why:t.priority+' priority, due today',score:50+PRI[t.priority]*5})});
  P('activities').forEach(a=>{if(a.status==='Complete')return;const s=diff(a.start,T),v=varianceDays(a);
    if(a.status==='Delayed')out.push({key:'a'+a.id,kind:'activities',id:a.id,title:a.name+' is delayed',why:v>0?v+' day'+(v>1?'s':'')+' behind programme':'Marked as delayed',score:55});
    else if(a.status==='Not Started'&&s>=0&&s<=3)out.push({key:'a'+a.id,kind:'activities',id:a.id,title:a.name+(s===0?' starts today':' starts in '+s+' day'+(s>1?'s':'')),why:[conName(a.contractorId),conTone(a.id)==='Red'?'red constraint open':conTone(a.id)==='Amber'?'constraint at risk':''].filter(Boolean).join(', ')||'Starting soon',score:48-s})});
  P('milestones').forEach(m=>{if(m.done)return;const s=diff(m.date,T);if(s>=0&&s<=7)out.push({key:'m'+m.id,kind:'milestones',id:m.id,title:m.name+(s===0?' is today':' in '+s+' day'+(s>1?'s':'')),why:'Milestone',score:40-s})});
  return out.sort((x,y)=>y.score-x.score);
}
const todaysFocus=()=>focusItems().slice(0,3);

function atRiskItems(){
  const out=[];

function dailyInsight(){
  const acts=P('activities').filter(a=>a.status!=='Complete').map(a=>({a,v:varianceDays(a)})).sort((x,y)=>y.v-x.v);
  const worst=acts[0];
  if(worst&&worst.v>=2){const a=worst.a,n=actTasks(a.id).filter(t=>t.status!=='Complete').length,t=conTone(a.id);
    return {text:a.name+' is about '+worst.v+' days behind programme'+(n?', with '+n+' open task'+(n>1?'s':'')+' linked to it':'')+(t==='Red'?' and a blocked constraint':'')+'.',kind:'activities',id:a.id}}
  const od=openTasks().filter(isOverdue).sort(taskSort);
  if(od.length)return {text:od.length+' task'+(od.length>1?'s are':' is')+' overdue. The oldest is "'+od[0].title+'".',kind:'tasks',id:od[0].id};
  const nx=P('activities').filter(a=>a.status==='Not Started'&&diff(a.start,today())>=0).sort((a,b)=>a.start<b.start?-1:1)[0];
  if(nx)return {text:'Nothing is slipping. Next start is '+nx.name+' on '+fmt(nx.start)+'.',kind:'activities',id:nx.id};
  return null;
}

function alerts(){
  const T=today(),out=[];
  const add=(key,tone,title,text,kind,id,when)=>out.push({key:key+'|'+T,tone,title,text,kind,id,when});
  P('tasks').forEach(t=>{if(t.status==='Complete'||!t.due)return;const o=diff(T,t.due);
    if(o>0)add('od'+t.id,'crit',(t.status==='Waiting'?'Waiting item overdue: ':'Overdue: ')+t.title,o+' day'+(o>1?'s':'')+' overdue','tasks',t.id,'09:00 daily');
    else if(o===-1)add('dt'+t.id,'warn','Due tomorrow: '+t.title,'Reminder sent at 18:00 the day before','tasks',t.id,'18:00');
    else if(o===0&&PRI[t.priority]>=2)add('hp'+t.id,'warn',t.priority+' priority due today: '+t.title,'','tasks',t.id,'Today')});
  P('activities').forEach(a=>{if(a.status==='Complete')return;const s=diff(a.start,T),tn=conTone(a.id);
    if(s>=0&&s<=7&&(tn==='Red'||tn==='Amber'||a.status==='Delayed'))add('ac'+a.id,tn==='Red'?'crit':'warn','Critical activity approaching: '+a.name,'Starts '+(s===0?'today':'in '+s+' day'+(s>1?'s':''))+(tn&&tn!=='Green'?' with a constraint open':''),'activities',a.id,'7 days before start')});
  P('risks').forEach(r=>{if(r.created&&Date.now()-new Date(r.created).getTime()<864e5&&r.status!=='Closed')add('rk'+r.id,'warn','Risk added: '+r.title,'Logged in the last 24 hours','risks',r.id,'When added')});
  return out;
}

/* ----- lookahead ----- */
function lookahead(days){
  const T=today(),end=addDays(T,days),g={};
  P('activities').filter(a=>a.status!=='Complete'&&a.start<=end&&a.finish>=T).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0).forEach(a=>{const wc=mondayOf(a.start<T?T:a.start);(g[wc]=g[wc]||[]).push(a)});
  return Object.keys(g).sort().map(wc=>({wc,items:g[wc]}));
}
function lookState(a){const t=conTone(a.id);return t==='Red'?{l:'Blocked',tone:'crit'}:t==='Amber'?{l:'At risk',tone:'warn'}:{l:'Ready',tone:'ok'}}
function lookaheadText(days){
  const p=curProject();let o=(days/7)+' week lookahead, '+(p?p.name:'')+'\nGenerated '+fmtL(today())+'\n';
  const gs=lookahead(days);if(!gs.length)return o+'\nNo activities in this window.';
  gs.forEach(g=>{o+='\nWeek commencing '+fmt(g.wc)+'\n';g.items.forEach(a=>{const c=byId('contractors',a.contractorId);o+='- '+a.name+' ('+fmtS(a.start)+' to '+fmtS(a.finish)+')'+(c?', '+c.company+(c.labour?', '+c.labour+' operatives':''):'')+', '+lookState(a).l.toLowerCase()+'\n'})});
  return o;
}

/* ----- text rules: links, inbox suggestions, meeting actions ----- */
const STOP=['ltd','limited','first','second','fix','level','works','area','group','services','the','and','pool','hall'];
function stemRe(tok){const t=tok.toLowerCase();return t.length>=5?new RegExp('\\b'+t.slice(0,5).replace(/[^a-z0-9&]/g,'')):new RegExp('\\b'+t.replace(/[^a-z0-9&]/g,'')+'\\b')}
function normTrade(s){return String(s).replace(/\bdry[\s-]?liners?\b/g,'drylining').replace(/\broofers?\b/g,'roofing')}
function guessLinks(text){
  const low=normTrade(String(text||'').toLowerCase());let con=null;
  for(const c of P('contractors')){
    const words=(c.company+' '+(c.package||'')).split(/[^A-Za-z0-9&]+/).filter(w=>w&&!STOP.includes(w.toLowerCase())&&(w.length>=4||/[A-Z&]{3}/.test(w)));
    if(words.some(w=>stemRe(w).test(low))){con=c;break}
  }
  let act=null;
  if(con)act=P('activities').find(a=>a.contractorId===con.id&&a.status!=='Complete')||null;
  if(!act){let best=0;P('activities').forEach(a=>{const n=a.name.split(/\s+/).filter(w=>w.length>=5&&!STOP.includes(w.toLowerCase())).filter(w=>stemRe(w).test(low)).length;if(n>best){best=n;act=a}})}
  return {contractorId:con?con.id:'',activityId:act?act.id:''};
}
function classify(text,kind){
  const low=String(text||'').toLowerCase(),s=[];
  const risk=/(reduc|behind|delay|late\b|shortage|slip|cancel|not started|stoppage|down to|short of|overrun)/.exec(low);
  const cons=/(access|approval|approve|design|information|material|awaiting|waiting|not released|release|permit|drawing|instruction|outstanding)/.exec(low);
  const task=/(chase|submit|send|confirm|arrange|order|check|review|need|must|call|email|provide|book|update|prepare|ring\b|remind|forget|remember|make sure|meeting)/.exec(low);
  if(isClearReminder(text))s.push({k:'task',why:'Reads like a reminder, so a task is the natural home'});
  if(risk)s.push({k:'risk',why:'Mentions "'+risk[1]+'", which can threaten the programme'});
  if(task&&!s.some(x=>x.k==='task'))s.push({k:'task',why:'Reads like an action ("'+task[1]+'")'});
  if(cons)s.push({k:'constraint',why:'Mentions "'+cons[1]+'", which can block work'});
  if(kind==='photo'){s.unshift({k:'diary',why:'Photos are kept as site evidence'})}
  if(!s.length)s.push({k:'task',why:'No clear signal, so a task is the safest default'});
  if(!s.some(x=>x.k==='note'))s.push({k:'note',why:''});
  return s;
}
function extractActions(text){
  const lines=String(text||'').split(/\n+|(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>6);
  const out=[];
  lines.forEach(l=>{
    const low=l.toLowerCase();let kind=null;
    if(/(outstanding|awaiting|waiting|pending|approval|tbc|to be confirmed)/.test(low))kind='waiting';
    else if(/(submit|send|provide|confirm|chase|issue|arrange|review|update|prepare|check|agree|order|need|must|required)/.test(low))kind='action';
    else if(/(reduc|behind|delay|late\b|shortage|slip|not started)/.test(low))kind='risk';
    if(!kind)return;
    const links=guessLinks(l);const clean=l.replace(/[.!?]+$/,'');
    let due=null;const dw=/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*/.exec(low);
    if(/\btoday\b/.test(low))due=today();else if(/\btomorrow\b/.test(low))due=addDays(today(),1);
    else if(dw)due=nextDow(['sun','mon','tue','wed','thu','fri','sat'].indexOf(dw[1]));
    else due=nextDow(5);
    const owner=links.contractorId?conName(links.contractorId):/\bclient\b/.test(low)?'Client':/\b(architect|designer)\b/.test(low)?'Architect':'';
    out.push({title:kind==='waiting'?'Chase: '+clean:kind==='risk'?'Confirm impact: '+clean:cap1(clean),status:kind==='waiting'?'Waiting':'Open',priority:kind==='risk'?'High':'Medium',due,owner,contractorId:links.contractorId,activityId:links.activityId,on:true})
  });
  return out;
}

/* ----- diary draft ----- */
function draftDiary(date){
  const onDay=x=>(x.created||'').slice(0,10)===date||(x.created&&iso(new Date(x.created))===date);
  const prog=[],iss=[],obs=[],photos=[];
  P('activities').filter(a=>a.status==='In Progress').slice(0,6).forEach(a=>prog.push(a.name+' at '+(a.progress||0)+'%'+(a.contractorId?' ('+conName(a.contractorId)+')':'')));
  P('tasks').filter(t=>t.completedAt&&iso(new Date(t.completedAt))===date).forEach(t=>prog.push('Completed: '+t.title));
  P('notes').filter(onDay).forEach(n=>{const line=(n.title?n.title+': ':'')+clip(n.text,160);
    if(n.type==='Issue')iss.push(line);else if(n.type==='Progress')prog.push(line);else obs.push(line);(n.photos||[]).forEach(p=>photos.push(p))});
  P('inbox').filter(onDay).forEach(i=>{obs.push('Captured: '+clip(i.text,140));(i.photos||[]).forEach(p=>photos.push(p))});
  P('risks').filter(onDay).forEach(r=>iss.push('Risk logged: '+r.title));
  P('constraints').filter(c=>c.status==='Red').slice(0,3).forEach(c=>iss.push('Blocked: '+c.title+(c.activityId?' ('+actName(c.activityId)+')':'')));
  const ids=new Set(P('activities').filter(a=>a.status==='In Progress'||a.status==='Delayed').map(a=>a.contractorId));
  const labour=P('contractors').filter(c=>ids.has(c.id)).reduce((s,c)=>s+(Number(c.labour)||0),0);
  return {date,weather:'Dry',labour:labour||'',progress:prog.map(x=>'- '+x).join('\n'),issues:iss.map(x=>'- '+x).join('\n'),deliveries:'',observations:obs.map(x=>'- '+x).join('\n'),photos:photos.slice(0,12)};
}

/* ----- search ----- */
const SRC=[
 {k:'tasks',lab:'Task',t:x=>x.title,b:x=>[x.desc,x.expectedFrom,actName(x.activityId),conName(x.contractorId)].join(' '),sub:x=>(x.status==='Complete'?'Done':relDue(x.due))+(x.status==='Waiting'?' · waiting on '+(x.expectedFrom||'someone'):''),open:x=>x.status!=='Complete'},
 {k:'notes',lab:'Note',t:x=>x.title||clip(x.text,60),b:x=>[x.text,x.tags,x.type,(x.photos&&x.photos.length?'photo':'')].join(' '),sub:x=>x.type+' · '+fmtS((x.created||'').slice(0,10))},
 {k:'risks',lab:'Risk',t:x=>x.title,b:x=>[x.desc,x.mitigation,x.owner].join(' '),sub:x=>x.status+' · '+x.impact+' impact',open:x=>x.status==='Open'||x.status==='Monitoring'},
 {k:'constraints',lab:'Constraint',t:x=>x.title,b:x=>[x.type,actName(x.activityId)].join(' '),sub:x=>x.type+' · '+x.status,open:x=>x.status!=='Green'},
 {k:'activities',lab:'Activity',t:x=>x.name,b:x=>conName(x.contractorId),sub:x=>x.status+' · '+fmtS(x.start)+' to '+fmtS(x.finish),open:x=>x.status!=='Complete'},
 {k:'contractors',lab:'Contractor',t:x=>x.company,b:x=>[x.package,x.contact,x.email,x.phone].join(' '),sub:x=>x.package||''},
 {k:'meetings',lab:'Meeting',t:x=>x.title||x.type+' meeting',b:x=>[x.notes,x.attendees].join(' '),sub:x=>x.type+' · '+fmtS(x.date)},
 {k:'diary',lab:'Diary',t:x=>'Diary '+fmtS(x.date),b:x=>[x.progress,x.issues,x.observations,x.deliveries,x.weather].join(' '),sub:x=>x.weather||''},
 {k:'inbox',lab:'Inbox',t:x=>clip(x.text,60)||'Photo',b:x=>x.text,sub:x=>x.processed?'Processed':'Unprocessed'}
];
function searchAll(q){
  const toks=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return [];
  const res=[];
  SRC.forEach(s=>P(s.k).forEach(x=>{
    const t=String(s.t(x)||'').toLowerCase(),b=String(s.b(x)||'').toLowerCase();let sc=0,ok=true;
    for(const w of toks){let h=0;
      if(t.startsWith(w))h=7;else if(new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(t))h=5;else if(t.includes(w))h=3;
      else if(b.includes(w))h=1.5;
      if(!h){ok=false;break}sc+=h}
    if(!ok)return;
    if(s.open&&s.open(x))sc+=1;
    const c=(x.created||x.date||'').slice(0,10);if(c){const age=Math.max(0,diff(today(),c));sc+=Math.max(0,1-age/365)}
    res.push({kind:s.k,id:x.id,lab:s.lab,title:s.t(x),sub:s.sub(x),score:sc});
  }));
  return res.sort((a,b)=>b.score-a.score).slice(0,40);
}

/* ----- project assistant (rule based in this prototype) ----- */
function aiAnswer(q){
  const low=q.toLowerCase(),T=today();
  const it=(text,kind,id)=>({text,kind,id});
  const ans={q,blocks:[],why:'',sugs:[]};
  if(/lookahead|look ahead/.test(low)){
    const days=/6|six/.test(low)?42:14;
    const gs=lookahead(days);
    ans.blocks.push({h:(days/7)+' week lookahead',items:gs.flatMap(g=>g.items.map(a=>it('w/c '+fmtS(g.wc)+': '+a.name+(a.contractorId?' ('+conName(a.contractorId)+')':'')+' · '+lookState(a).l,'activities',a.id)))});
    if(!gs.length)ans.blocks[0].p='No activities fall in this window. Import or add a programme first.';
    ans.why='Built from activity start and finish dates and the constraints linked to each activity.';ans.look=days;return ans}
  if(/overdue/.test(low)){
    const od=openTasks().filter(isOverdue).sort(taskSort);
    ans.blocks.push({h:od.length+' overdue',items:od.map(t=>it(t.title+' · '+relDue(t.due)+(t.expectedFrom?' · waiting on '+t.expectedFrom:''),'tasks',t.id))});
    if(!od.length)ans.blocks[0].p='Nothing is overdue.';
    ans.why='Open tasks with a due date before today.';return ans}
  if(/chase|contractor|subcontractor/.test(low)){
    const rows=P('contractors').map(c=>{const ts=openTasks().filter(t=>t.contractorId===c.id),od=ts.filter(isOverdue).length,w=ts.filter(t=>t.status==='Waiting'&&t.due&&t.due<=T).length,
      noLab=P('activities').some(a=>a.contractorId===c.id&&a.status==='In Progress'&&!c.labour),red=P('constraints').some(x=>x.status==='Red'&&byId('activities',x.activityId)&&byId('activities',x.activityId).contractorId===c.id);
      const reasons=[od&&od+' overdue task'+(od>1?'s':''),w&&w+' item'+(w>1?'s':'')+' waiting on them',noLab&&'no labour forecast',red&&'blocked by a red constraint'].filter(Boolean);
      return {c,reasons,score:od*2+w*2+(noLab?2:0)+(red?1:0)}}).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);
    ans.blocks.push({h:'Contractors to chase',items:rows.map(r=>it(r.c.company+': '+r.reasons.join(', '),'contractors',r.c.id))});
    if(!rows.length)ans.blocks[0].p='No contractor currently needs chasing.';
    rows.slice(0,2).forEach(r=>ans.sugs.push({l:'Create task: Chase '+r.c.company,pre:{title:'Chase '+r.c.company,contractorId:r.c.id,due:T,priority:'High'}}));
    ans.why='Counts overdue tasks, overdue waiting items, missing labour forecasts and red constraints for each contractor.';return ans}
  if(/threat|worr|complet|impact|delay|slip/.test(low)&&!/start/.test(low)){
    const items=[];
    P('activities').filter(a=>a.status!=='Complete').forEach(a=>{const v=varianceDays(a);if(a.status==='Delayed'||v>=2)items.push({r:v+5,x:it(a.name+' is '+(v>0?v+' days behind programme':'delayed')+(conTone(a.id)==='Red'?' and blocked':''),'activities',a.id)})});
    P('constraints').filter(c=>c.status==='Red').forEach(c=>items.push({r:9,x:it('Blocked: '+c.title+(c.activityId?' ('+actName(c.activityId)+')':''),'constraints',c.id)}));
    P('risks').filter(r=>r.status==='Open').forEach(r=>items.push({r:r.impact==='High'?8:4,x:it(r.title+' ('+r.impact.toLowerCase()+' impact)','risks',r.id)}));
    P('tasks').filter(t=>t.status==='Waiting'&&isOverdue(t)).forEach(t=>items.push({r:6,x:it(t.title+' is overdue from '+(t.expectedFrom||'someone'),'tasks',t.id)}));
    P('activities').filter(a=>a.status==='Not Started'&&diff(a.start,T)<=7&&diff(a.start,T)>=0&&conTone(a.id)==='Red').forEach(a=>items.push({r:7,x:it(a.name+' starts '+fmt(a.start)+' with a red constraint open','activities',a.id)}));
    items.sort((a,b)=>b.r-a.r);
    ans.blocks.push({h:'Current threats to completion',items:items.slice(0,8).map(i=>i.x)});
    if(!items.length)ans.blocks[0].p='Nothing in the data currently threatens completion.';
    ans.why='Looks at delayed or lagging activities, red constraints, open risks, overdue waiting items and imminent starts that are blocked. Lag is measured by comparing progress with elapsed time.';return ans}
  if(/summari[sz]e.*risk|risks/.test(low)&&!/at risk/.test(low)){
    const rs=P('risks');const by=s=>rs.filter(r=>r.status===s);
    ans.blocks.push({h:'Risk summary',p:by('Open').length+' open, '+by('Monitoring').length+' monitoring, '+by('Mitigated').length+' mitigated, '+by('Closed').length+' closed.',items:rs.filter(r=>r.status==='Open'||r.status==='Monitoring').sort((a,b)=>PRI[b.impact]-PRI[a.impact]).map(r=>it(r.title+' · '+r.impact+' impact · '+r.status,'risks',r.id))});
    ans.why='Counts by status, with live risks sorted by impact.';return ans}
  if(/at risk|risk/.test(low)&&/activit/.test(low)){
    const rows=P('activities').filter(a=>a.status!=='Complete'&&(a.status==='Delayed'||conTone(a.id)==='Red'||conTone(a.id)==='Amber'||varianceDays(a)>=2));
    ans.blocks.push({h:'Activities at risk',items:rows.map(a=>it(a.name+' · '+[a.status==='Delayed'?'delayed':'',varianceDays(a)>=2?varianceDays(a)+'d behind':'',conTone(a.id)==='Red'?'blocked':conTone(a.id)==='Amber'?'constraint at risk':''].filter(Boolean).join(', '),'activities',a.id))});
    if(!rows.length)ans.blocks[0].p='No activities are at risk.';
    ans.why='Activities that are delayed, lag their planned progress by two days or more, or have an amber or red constraint.';return ans}
  if(/start|next week|this week|coming/.test(low)&&!/summari/.test(low)){
    const nw=/next week/.test(low);const from=nw?nextDow(1):T,to=nw?addDays(from,6):addDays(T,7);
    const rows=P('activities').filter(a=>a.start>=from&&a.start<=to).sort((a,b)=>a.start<b.start?-1:1);
    ans.blocks.push({h:'Starting '+(nw?'next week':'in the next 7 days'),items:rows.map(a=>it(fmt(a.start)+': '+a.name+(a.contractorId?' ('+conName(a.contractorId)+')':'')+' · '+lookState(a).l,'activities',a.id))});
    if(!rows.length)ans.blocks[0].p='No activities start in that window.';
    ans.why='Activities whose start date falls between '+fmtS(from)+' and '+fmtS(to)+'.';return ans}
  if(/summari[sz]e|week/.test(low)&&!/diary/.test(low)){
    const w0=addDays(T,-7),done=P('tasks').filter(t=>t.completedAt&&iso(new Date(t.completedAt))>=w0).length,
      started=P('activities').filter(a=>a.start>=w0&&a.start<=T).length,finished=P('activities').filter(a=>a.status==='Complete').length,
      nr=P('risks').filter(r=>r.created&&iso(new Date(r.created))>=w0).length,del=P('activities').filter(a=>a.status==='Delayed').length,od=openTasks().filter(isOverdue).length;
    ans.blocks.push({h:'Last 7 days',p:done+' tasks completed, '+started+' activities started, '+nr+' risks logged. Now: '+del+' delayed activit'+(del===1?'y':'ies')+', '+od+' overdue task'+(od===1?'':'s')+', '+finished+' activit'+(finished===1?'y':'ies')+' complete.',items:P('activities').filter(a=>a.status==='Delayed').map(a=>it(a.name+' is delayed','activities',a.id))});
    ans.why='Counted from task completion dates, activity start dates and risk creation dates.';return ans}
  if(/diary/.test(low)){
    const dd=draftDiary(T);
    ans.blocks.push({h:"Draft diary for today",p:'Weather: '+dd.weather+(dd.labour?' · Labour on site about '+dd.labour:''),items:[]});
    ['progress','issues','observations'].forEach(k=>{if(dd[k])ans.blocks.push({h:cap1(k),p:dd[k]})});
    ans.why='Compiled from today\'s notes, captures, completed tasks and active activities. Nothing is saved until you approve it.';ans.diary=true;return ans}
  if(/focus|today|priorit|first/.test(low)){
    const f=focusItems().slice(0,5);
    ans.blocks.push({h:'What to focus on today',items:f.map(x=>it(x.title+' · '+x.why,x.kind,x.id))});
    if(!f.length)ans.blocks[0].p='Nothing urgent. Use the time to plan ahead.';
    ans.why='Ranks red constraints, high-impact risks, overdue and waiting items, delayed activities and starts within three days.';return ans}
  const r=searchAll(q).slice(0,6);
  if(r.length){ans.blocks.push({h:'Closest matches in your project',items:r.map(x=>it(x.lab+': '+x.title+' · '+x.sub,x.kind,x.id))});ans.why='Searched tasks, notes, risks, activities, contractors, meetings and diary entries.';return ans}
  ans.blocks.push({h:'I can help with',p:'Try: What should I focus on today? What threatens completion? Which contractors need chasing? Which tasks are overdue? What activities start next week? Summarise my risks. Create a 2 week lookahead.'});
  ans.why='I answer from your project data. Ask about tasks, activities, risks, contractors or the diary.';return ans;
}

/* ===== multi-project helpers ===== */
function withProject(pid,fn){const old=S.cur;S.cur=pid;try{return fn()}finally{S.cur=old}}
function projectStats(pid){
  return withProject(pid,()=>{

/* ----- swipe on task rows ----- */
let sw=null,swiped=false;
document.addEventListener('pointerdown',e=>{
  const fg=e.target.closest&&e.target.closest('.trow-fg');if(!fg||e.target.closest('.chk'))return;
  sw={fg,x:e.clientX,y:e.clientY,dx:0,drag:false,id:fg.parentElement.dataset.id};
  sw.t=setTimeout(()=>{if(sw&&!sw.drag){const id=sw.id;sw=null;swiped=true;setTimeout(()=>{swiped=false},700);taskForm(id)}},560);
});
document.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){sw.drag=true;clearTimeout(sw.t);sw.fg.style.transition='none';try{sw.fg.setPointerCapture(e.pointerId)}catch(_){}}
    else if(Math.abs(dy)>10){clearTimeout(sw.t);sw=null;return}}
  if(sw.drag){sw.dx=dx;sw.fg.style.transform='translateX('+dx+'px)';sw.fg.parentElement.dataset.dir=dx>0?'r':'l'}
});
function endSwipe(){
  if(!sw)return;clearTimeout(sw.t);const s=sw;sw=null;
  if(s.drag){swiped=true;setTimeout(()=>{swiped=false},120);s.fg.style.transition='';s.fg.style.transform='';s.fg.parentElement.dataset.dir='';
    if(s.dx>90)completeTask(s.id);else if(s.dx<-90)postponeTask(s.id)}
}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);
document.addEventListener('click',e=>{if(swiped){e.stopPropagation();e.preventDefault();swiped=false}},true);

/* ----- Tasks ----- */
function tasksFor(v){
  const T=today(),ts=P('tasks');
  if(v==='completed')return ts.filter(t=>t.status==='Complete').sort((a,b)=>(a.completedAt||'')<(b.completedAt||'')?1:-1).slice(0,60);
  const open=ts.filter(t=>t.status!=='Complete');
  if(v==='waiting')return open.filter(t=>t.status==='Waiting').sort(taskSort);
  const act=open.filter(t=>t.status!=='Waiting');
  if(v==='today')return act.filter(t=>t.due&&t.due<=T).sort(taskSort);
  if(v==='tomorrow')return act.filter(t=>t.due===addDays(T,1)).sort(taskSort);
  return act.filter(t=>!t.due||(t.due>=T&&t.due<=addDays(T,6))||t.due<T).sort(taskSort);
}
function viewTasks(){
  const T=today(),v=V.tasks;
  const segs=[['today','Today'],['tomorrow','Tomorrow'],['week','This week'],['waiting','Waiting for'],['completed','Completed']].map(a=>({k:a[0],l:a[1],n:a[0]==='completed'?undefined:tasksFor(a[0]).length}));
  let o='<h1 class="scr-title">Tasks</h1>'+segHTML([{k:'list',l:'List'},{k:'board',l:'Board'},{k:'cal',l:'Calendar'}],V.tmode,'tmode');
  if(V.tmode==='cal')return o+calView();
  if(V.tmode==='board')return o+quickAddHTML('Add a task and press Enter')+boardView();
  o+=segHTML(segs,v,'taskTab');
  o+=quickAddHTML(v==='waiting'?'Add something you are waiting for':'Add a task and press Enter');
  const list=tasksFor(v);
  if(!list.length)return o+emptyBig(v==='completed'?'No completed tasks yet':v==='waiting'?'Nothing waiting':'Nothing here','Swipe right to complete, swipe left to postpone, press and hold to edit.');
  if(v==='today'){const od=list.filter(t=>t.due<T),td=list.filter(t=>t.due===T);
    if(od.length)o+='<div class="grp crit">Overdue <span>'+od.length+'</span></div>'+od.map(t=>taskRow(t)).join('');
    if(td.length)o+='<div class="grp">Today <span>'+td.length+'</span></div>'+td.map(t=>taskRow(t)).join('')}
  else if(v==='week'){const gs={};list.forEach(t=>{const k=!t.due?'none':t.due<T?'over':t.due;(gs[k]=gs[k]||[]).push(t)});
    if(gs.over)o+='<div class="grp crit">Overdue <span>'+gs.over.length+'</span></div>'+gs.over.map(t=>taskRow(t)).join('');
    Object.keys(gs).filter(k=>k!=='over'&&k!=='none').sort().forEach(k=>{o+='<div class="grp">'+esc(k===T?'Today':k===addDays(T,1)?'Tomorrow':fmt(k))+'</div>'+gs[k].map(t=>taskRow(t)).join('')});
    if(gs.none)o+='<div class="grp">No date</div>'+gs.none.map(t=>taskRow(t)).join('')}
  else o+=list.map(t=>taskRow(t,true)).join('');
  return o;
}

  const list=cs.filter(c=>f==='All'||c.status===f).sort((a,b)=>CSTAT.indexOf(b.status)-CSTAT.indexOf(a.status));

}

function quickAddHTML(ph){return '<div class="qa"><input id="quickAdd" type="text" placeholder="'+esc(ph)+'" aria-label="New task title" autocomplete="off"><button class="btn" data-act="quickAdd" aria-label="Add task">'+ic('plus',20)+'</button></div>'}

const BOARD_COLS=[['Open','Open'],['In Progress','In progress'],['Waiting','Waiting for'],['Complete','Done']];
function boardView(){
  const T=today(),ts=P('tasks'),w0=addDays(T,-7);
  const items=s=>ts.filter(t=>t.status===s&&(s!=='Complete'||(t.completedAt&&iso(new Date(t.completedAt))>=w0))).sort(s==='Complete'?(a,b)=>(a.completedAt<b.completedAt?1:-1):taskSort);
  return '<div class="board">'+BOARD_COLS.map((c,ci)=>{const l=items(c[0]);
    return '<section class="col" data-status="'+c[0]+'" aria-label="'+c[1]+'"><div class="col-h"><b>'+c[1]+'</b><span class="ct">'+l.length+'</span></div><div class="col-b">'+(l.length?l.map(t=>kcard(t,ci)).join(''):'<div class="col-e">Nothing here</div>')+'</div></section>'}).join('')+
    '</div><p class="hint" style="margin-top:10px">Drag a card by its handle, or use the arrows, to change its status. Done shows the last 7 days.</p>';
}
function kcard(t,ci){
  const last=BOARD_COLS.length-1;
  return '<article class="kc'+(isOverdue(t)?' od':'')+'" data-id="'+t.id+'"><div class="kc-t" data-act="openTask" data-id="'+t.id+'">'+esc(t.title)+'</div>'+taskMeta(t,false)+
   '<div class="kc-f"><button class="kb" data-act="moveTask" data-id="'+t.id+'" data-d="-1"'+(ci===0?' disabled':'')+' aria-label="Move left">'+ic('back',16)+'</button><button class="kb kg" data-grip aria-label="Drag to another column">'+ic('grip',18)+'</button><button class="kb" data-act="moveTask" data-id="'+t.id+'" data-d="1"'+(ci===last?' disabled':'')+' aria-label="Move right">'+ic('chev',16)+'</button></div></article>';
}
function setTaskStatus(id,s){
  if(!guard('create'))return;const t=byId('tasks',id);if(!t||t.status===s)return;
  const prev={status:t.status,completedAt:t.completedAt||''};t.status=s;fixTask(t);commit();
  const lab=(BOARD_COLS.find(c=>c[0]===s)||[0,s])[1];
  toast('Moved to '+lab,{l:'Undo',fn:()=>{t.status=prev.status;t.completedAt=prev.completedAt;commit()}});
}

function calEvents(d){
  const own=k=>P(k);
  return {
    tasks:own('tasks').filter(t=>t.due===d).sort(taskSort),
    starts:own('activities').filter(a=>a.start===d&&a.start!==a.finish),
    ends:own('activities').filter(a=>a.finish===d&&a.start!==a.finish),
    miles:own('milestones').filter(m=>m.date===d),
    cons:own('constraints').filter(c=>c.due===d&&c.status!=='Green'),
    meets:own('meetings').filter(m=>m.date===d),
    diary:own('diary').filter(x=>x.date===d),
    running:own('activities').filter(a=>a.start<d&&a.finish>d&&a.status!=='Complete')
  };
}
function calView(){
  const T=today();
  if(!V.calM)V.calM=T.slice(0,7)+'-01';
  if(!V.calD)V.calD=T;
  const first=V.calM,start=mondayOf(first);
  const label=parse(first).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  let o='<div class="cal-h"><button class="ibtn" data-act="calNav" data-d="-1" aria-label="Previous month">'+ic('back')+'</button><b>'+esc(label)+'</b><button class="ibtn" data-act="calNav" data-d="1" aria-label="Next month">'+ic('chev')+'</button><button class="btn ghost sm" data-act="calToday">Today</button></div>';
  o+='<div class="cal" role="grid"><div class="cal-w" role="row">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<span role="columnheader">'+x+'</span>').join('')+'</div><div class="cal-g">';
  for(let i=0;i<42;i++){
    const d=addDays(start,i),ev=calEvents(d),inM=d.slice(0,7)===first.slice(0,7);
    const openT=ev.tasks.filter(t=>t.status!=='Complete'),late=openT.some(t=>d<T);
    const dots=[openT.length?'<i class="cdot k-task'+(late?' late':'')+'"></i>':'',(ev.starts.length||ev.ends.length)?'<i class="cdot k-act"></i>':'',ev.miles.length?'<i class="cdot k-mile"></i>':'',ev.cons.length?'<i class="cdot k-cons"></i>':'',ev.meets.length?'<i class="cdot k-meet"></i>':''].join('');
    const n=openT.length+ev.starts.length+ev.ends.length+ev.miles.length+ev.cons.length+ev.meets.length;
    o+='<button class="cd'+(inM?'':' out')+(d===T?' today':'')+(d===V.calD?' sel':'')+'" role="gridcell" data-act="calDay" data-d="'+d+'" aria-label="'+esc(fmtL(d))+(n?', '+n+' item'+(n>1?'s':''):'')+'"><span class="dn">'+parse(d).getDate()+'</span><span class="dots">'+dots+'</span></button>';
  }
  o+='</div></div><div class="legend"><span><i class="cdot k-task"></i>Task due</span><span><i class="cdot k-act"></i>Activity starts or finishes</span><span><i class="cdot k-mile"></i>Milestone</span><span><i class="cdot k-cons"></i>Constraint due</span><span><i class="cdot k-meet"></i>Meeting</span></div>';
  const d=V.calD,ev=calEvents(d);
  const total=ev.tasks.length+ev.starts.length+ev.ends.length+ev.miles.length+ev.cons.length+ev.meets.length+ev.diary.length;
  o+='<div class="sec-h" style="margin-top:16px">'+esc(fmtL(d))+(can('create')?'<button data-act="newTaskOn" data-d="'+d+'">+ Task</button>':'')+'</div>';
  if(!total&&!ev.running.length)o+='<p class="mt">Nothing scheduled.</p>';
  if(ev.miles.length)o+='<div class="grp">Milestones</div>'+ev.miles.map(m=>'<button class="lc" data-act="openMile" data-id="'+m.id+'"><div class="h"><b>'+esc(m.name)+'</b>'+(m.done?pill('Achieved','ok'):pill('Milestone','warn'))+'</div></button>').join('');
  if(ev.starts.length)o+='<div class="grp">Starting</div>'+ev.starts.map(actRow).join('');
  if(ev.ends.length)o+='<div class="grp">Finishing</div>'+ev.ends.map(actRow).join('');
  if(ev.tasks.length)o+='<div class="grp">Tasks due</div>'+ev.tasks.map(t=>taskRow(t,true)).join('');
  if(ev.cons.length)o+='<div class="grp">Constraints to clear</div>'+ev.cons.map(conRow).join('');
  if(ev.meets.length)o+='<div class="grp">Meetings</div>'+ev.meets.map(m=>'<button class="lc" data-act="openMeet" data-id="'+m.id+'"><div class="h"><b>'+esc(m.title||m.type+' meeting')+'</b>'+pill(m.type)+'</div></button>').join('');
  if(ev.diary.length)o+='<div class="grp">Diary</div>'+ev.diary.map(x=>'<button class="lc" data-act="openDiary" data-id="'+x.id+'"><div class="h"><b>Daily diary</b>'+pill(x.weather||'No weather')+'</div></button>').join('');
  if(ev.running.length)o+='<div class="grp">In progress on this day <span>'+ev.running.length+'</span></div>'+ev.running.map(a=>'<button class="li" data-act="openAct" data-id="'+a.id+'"><span class="m"><span class="t">'+esc(a.name)+'</span><span class="s">'+esc(fmtS(a.start))+' to '+esc(fmtS(a.finish))+(a.contractorId?' · '+esc(conName(a.contractorId)):'')+'</span></span>'+ic('chev',16)+'</button>').join('');
  return o;
}

const normKey=k=>String(k).toLowerCase().replace(/[^a-z%]/g,'');
function toISO(v){
  if(v instanceof Date&&!isNaN(v)){return iso(new Date(v.getTime()+43200000))}
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}

  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(s);if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])}

}
function mapRows(raw){

  const kName=find(/(activity|taskname|task|name|description)/),kStart=find(/(start|begin)/),kFin=find(/(finish|end|completiondate|due)/),
    kStat=find(/status/),kCon=find(/(contractor|resource|trade|subcontract|responsible|package|company)/),kProg=keys.find(k=>/(progress|percent|%|^complete$)/.test(normKey(k))&&k!==kFin);
  if(!kName||!kStart||!kFin)throw new Error('Could not find Activity, Start and Finish columns. Rename the headings and try again.');
  const out=[];let skipped=0;
  raw.forEach(r=>{
    const name=String(r[kName]||'').trim(),start=toISO(r[kStart]),finish=toISO(r[kFin]);
    if(!name||!start||!finish){if(name||start||finish)skipped++;return}
    let prog=kProg?parseFloat(String(r[kProg]).replace('%','')):NaN;if(!isNaN(prog)&&prog>0&&prog<=1&&!/%/.test(String(r[kProg])))prog=prog*100;if(isNaN(prog))prog=0;prog=Math.round(Math.max(0,Math.min(100,prog))/5)*5;
    const st=kStat?String(r[kStat]).toLowerCase():'';

    if(status==='Complete')prog=100;

  });
  if(!out.length)throw new Error('No usable rows. Each row needs an activity name, a start date and a finish date.');

}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch==='\t'){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=ch}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);
  if(rows.length<2)return [];
  const head=rows[0].map(h=>h.trim());return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>{o[h||'col'+i]=r[i]!=null?r[i]:''});return o});
}
async function parseProgFile(file){

/* ----- say it, it is logged: natural-language capture ----- */
const DOW_RE='(mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:r(?:s(?:day)?)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)';
const MON3=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MONTH_RE='(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec)';

function parseWhen(text){
  let s=' '+text+' ',due=null,m;const T=today();

  const pre='(?:\\b(?:by|on|for|before|until)\\s+)?',dowPre='(?:\\b'+DOW_RE+'\\b,?\\s+)?';

  else if((m=/\bnext week\b/i.exec(s))){due=nextDow(1);strip(/\b(?:by|for|until)?\s*next week\b/i)}
  else if((m=/\b(?:by\s+)?(?:end of (?:the )?week|eow|friday eod)\b/i.exec(s))){due=addDays(T,(5-parse(T).getDay()+7)%7);strip(m[0])}
  else if((m=new RegExp(lead+'\\b(today|tonight|this evening|this afternoon|this morning)\\b','i').exec(s))){due=T;strip(m[0])}
  else if((m=new RegExp(lead+'\\btomorrow\\b','i').exec(s))){due=addDays(T,1);strip(m[0])}
  else if((m=new RegExp(pre+dowPre+'\\b(\\d{1,2})(?:st|nd|rd|th)?(?:\\s+of)?\\s+'+MONTH_RE+'\\b\\.?','i').exec(s))&&(d2=dmy(+m[2],m[3]))){due=d2;strip(m[0])}
  else if((m=new RegExp(pre+dowPre+'\\b'+MONTH_RE+'\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b','i').exec(s))&&(d2=dmy(+m[3],m[2]))){due=d2;strip(m[0])}
  else if((m=/\b(?:by|on|for|before|until)?\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/.exec(s))&&(()=>{let y=m[3]?+m[3]:parse(T).getFullYear();if(y<100)y+=2000;const c=iso(new Date(y,+m[2]-1,+m[1]));if(!isNaN(parse(c))){due=c;return true}return false})()){strip(m[0])}

    const k=m[1].slice(0,3).toLowerCase();due=nextDow(['sun','mon','tue','wed','thu','fri','sat'].indexOf(k));strip(m[0])}

const tidy=s=>cap1(String(s||'').replace(/^(?:the|a|an)\s+/i,'').replace(/[\s,.;:!?]+$/,'').trim());
function parseCapture(raw){
  let t=String(raw||'').trim().replace(/\s+/g,' ');
  t=t.replace(/^(?:please\s+)?(?:remind me|reminders?|don'?t forget|remember|note to self|to ?do|i need|need|i must|must|make sure)\b\s*(?:(?:to|about|that|of)\b|:|-)?\s*/i,'').replace(/^to\s+/i,'');

function daySummary(date,ov){
  const p=curProject(),ex=P('diary').find(d=>d.date===date),d=Object.assign({},ex||draftDiary(date),ov||{});
  const bl=s=>String(s||'').split('\n').map(x=>x.replace(/^\s*[-•*]\s*/,'').trim()).filter(Boolean);

  o+=sec('Progress',bl(d.progress));
  const risk=P('activities').filter(a=>a.status==='Delayed'||(a.status==='In Progress'&&varianceDays(a)>=3)).map(behind).concat(P('constraints').filter(c=>c.status==='Red').map(c=>'Blocked: '+c.title+(c.activityId?' ('+actName(c.activityId)+')':'')));

  o+=sec('Waiting on others',P('tasks').filter(t=>t.status==='Waiting').sort(taskSort).map(t=>t.title+' from '+(t.expectedFrom||'unassigned')+(t.due?(t.due<date?', overdue since '+fmtS(t.due):', due '+fmtS(t.due)):'')));
  const nx=addDays(date,1);
  o+=sec('Tomorrow',P('tasks').filter(t=>t.status!=='Complete'&&t.status!=='Waiting'&&t.due===nx).map(t=>t.title).concat(P('activities').filter(a=>a.start===nx).map(a=>'Start: '+a.name+(a.contractorId?' ('+conName(a.contractorId)+')':''))));
  return o;
}

/* ----- corridor catch-up ----- */
function conWords(c){return (c.company+' '+(c.package||'')).split(/[^A-Za-z0-9&]+/).filter(w=>w&&!STOP.includes(w.toLowerCase())&&(w.length>=4||/[A-Z&]{3}/.test(w)))}
function conMentioned(c,text){const low=normTrade(String(text||'').toLowerCase());return !!low&&conWords(c).some(w=>stemRe(w).test(low))}
function catchUp(id){
  const c=byId('contractors',id),T=today(),since=Date.now()-48*36e5,open=P('tasks').filter(t=>t.status!=='Complete');
  const acts=P('activities').filter(a=>a.contractorId===id&&a.status!=='Complete');
  const owe=open.filter(t=>t.contractorId===id&&t.status!=='Waiting').sort(taskSort);
  const waits=open.filter(t=>t.status==='Waiting'&&(t.contractorId===id||(t.expectedFrom&&conMentioned(c,t.expectedFrom)))).sort(taskSort);
  const missing=!c.labour&&acts.some(a=>a.status==='In Progress'||(diff(a.start,T)>=0&&diff(a.start,T)<=14));
  const ownedCons=P('constraints').filter(x=>x.status!=='Green'&&x.owner&&conMentioned(c,x.owner));
  const blocking=P('constraints').filter(x=>x.status!=='Green'&&acts.some(a=>a.id===x.activityId)&&ownedCons.indexOf(x)<0);
  const recentNotes=P('notes').filter(n=>new Date(n.created).getTime()>=since&&(n.contractorId===id||conMentioned(c,(n.title||'')+' '+(n.text||'')))).sort((a,b)=>a.created<b.created?1:-1);
  const recentCaps=P('inbox').filter(i=>!i.archived&&new Date(i.created).getTime()>=since&&conMentioned(c,i.text));
  return {c,acts,owe,waits,missing,ownedCons,blocking,recentNotes,recentCaps};
}

A.impPick=()=>{pend={mode:'prog'};const f=$('#fileProg');f.value='';f.click()};
A.impSample=()=>{try{IMP.skipped=0;importDone(mapRows(sampleRows()),'Example programme')}catch(e){IMP.err=e.message;refreshSheets()}};
A.impMode=el=>{IMP.mode=el.dataset.k;refreshSheets()};
A.impBack=()=>{IMP.rows=null;refreshSheets()};
A.impGo=()=>{const r=applyImport();closeAll();V.tab='prog';V.prog='look6';commit();toast('Imported '+r.na+' activities, '+r.nm+' milestones'+(r.nc?' and '+r.nc+' new contractors':''))};
A.clearSample=()=>confirmSheet('Remove the example project and start your own?','Remove examples',()=>{COLL.forEach(k=>S[k]=[]);S.cur=null;S.sample=false;save();render();projForm(null,true)});
A.signIn=()=>{S.signedIn=true;commit()};
A.switchAccount=()=>confirmSheet('This removes all projects stored on this device.','Clear and switch',()=>{S=blank();save();render()});
A.startOwn=()=>{if(readWelcome()){S.sample=false;S.signedIn=true;save();render();projForm(null,true)}};
A.startSample=()=>{if(readWelcome()){applySample();S.signedIn=true;V.tab='home';save();render()}};
function readWelcome(){
  const n=$('#w_name').value.trim();const w=$('#w_name').parentElement;w.classList.toggle('bad',!n);
  if(!n){$('#w_name').focus();return false}
  S.profile={name:n,email:$('#w_email').value.trim(),role:$('#w_role').value};return true;
}
A.saveSettings=()=>{const n=$('#s_name').value.trim();if(!n){toast('Name is required.');return}S.profile={name:n,email:$('#s_email').value.trim(),role:$('#s_role').value};closeSheet();commit();toast('Saved')};
A.theme=el=>{S.theme=el.dataset.k;$$('#themeRow button').forEach(b=>b.classList.toggle('on',b===el));commit()};
A.editProject=()=>{if(curProject()){closeSheet();projForm(S.cur,false)}};
A.delProject=()=>{const p=curProject();if(!p)return;confirmSheet('Delete "'+p.name+'" and everything in it?','Delete project',()=>{const id=p.id;COLL.forEach(k=>{if(k!=='projects')S[k]=S[k].filter(x=>x.pid!==id)});S.projects=S.projects.filter(x=>x.id!==id);S.cur=S.projects[0]?S.projects[0].id:null;closeAll();commit();toast('Project deleted')})};
A.copyBackup=()=>copyText(backupText(),'Backup copied');
A.restorePick=()=>{pend={mode:'backup'};const f=$('#fileBackup');f.value='';f.click()};
A.loadSample=()=>confirmSheet('This replaces the data on this device with the example project.','Load example',()=>{applySample();closeAll();V.tab='home';commit()},'');
A.wipe=()=>confirmSheet('This deletes every project on this device.','Clear everything',()=>{COLL.forEach(k=>S[k]=[]);S.cur=null;S.sample=false;closeAll();commit()});
A.signOut=()=>{S.signedIn=false;closeAll();save();render()};
A.autoSet=el=>{S.autoTasks=el.dataset.k==='1';$$('#autoRow button').forEach(b=>b.classList.toggle('on',b===el));save();toast(S.autoTasks?'Clear reminders will become tasks automatically':'Reminders will wait in the Inbox')};
A.sweepInbox=()=>{if(!guard('create'))return;const pairs=[];P('inbox').filter(i=>!i.processed&&!i.archived&&i.text&&isClearReminder(i.text)).forEach(i=>pairs.push([i,autoTask(i)]));if(!pairs.length)return;commit();toast(pairs.length+' task'+(pairs.length>1?'s':'')+' created from your Inbox',{l:'Undo',fn:()=>{pairs.forEach(p=>undoAuto(p[0],p[1]));commit()}})};

A.tmode=el=>{V.tmode=el.dataset.k;render()};
A.moveTask=el=>{const t=byId('tasks',el.dataset.id);if(!t)return;const i=BOARD_COLS.findIndex(c=>c[0]===t.status),n=BOARD_COLS[i+(+el.dataset.d)];if(n)setTaskStatus(t.id,n[0])};
A.calNav=el=>{const d=parse(V.calM);d.setMonth(d.getMonth()+(+el.dataset.d));V.calM=iso(new Date(d.getFullYear(),d.getMonth(),1));render()};
A.calDay=el=>{V.calD=el.dataset.d;if(V.calD.slice(0,7)!==V.calM.slice(0,7))V.calM=V.calD.slice(0,7)+'-01';render()};
A.calToday=()=>{V.calM=today().slice(0,7)+'-01';V.calD=today();render()};
A.newTaskOn=el=>taskForm(null,{due:el.dataset.d});

/* board drag */
let dg=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');if(!g)return;
  const card=g.closest('.kc');if(!card)return;const r=card.getBoundingClientRect(),ghost=card.cloneNode(true);
  ghost.classList.add('ghost');ghost.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;pointer-events:none;z-index:150';
  document.body.appendChild(ghost);card.classList.add('dragging');dg={id:card.dataset.id,card,ghost,dx:e.clientX-r.left,dy:e.clientY-r.top};
  try{g.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!dg)return;dg.ghost.style.left=(e.clientX-dg.dx)+'px';dg.ghost.style.top=(e.clientY-dg.dy)+'px';
  const el=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):null,col=el&&el.closest?el.closest('.col'):null;
  $$('.col.over').forEach(c=>{if(c!==col)c.classList.remove('over')});if(col)col.classList.add('over');
  const b=$('.board');if(b){const r=b.getBoundingClientRect();if(e.clientX>r.right-40)b.scrollLeft+=14;else if(e.clientX<r.left+40)b.scrollLeft-=14}
});
function endDrag(e){
  if(!dg)return;const d=dg;dg=null;d.ghost.remove();d.card.classList.remove('dragging');
  const el=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):null,col=el&&el.closest?el.closest('.col'):null;
  $$('.col.over').forEach(c=>c.classList.remove('over'));
  if(col&&e.type==='pointerup')setTaskStatus(d.id,col.dataset.status);
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

/* ----- events ----- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-chg="actProg"]')){const a=byId('activities',el.dataset.id);if(a&&guard('manage')){a.progress=+el.value;if(a.progress>=100)a.status='Complete';else if(a.progress>0&&a.status==='Not Started')a.status='In Progress';commit()}}
  else if(el.matches('[data-chg="actStatus"]')){const a=byId('activities',el.dataset.id);if(a&&guard('manage')){a.status=el.value;if(el.value==='Complete')a.progress=100;commit()}}
  else if(el.id==='fileImg')onImages(Array.from(el.files||[]));
  else if(el.id==='fileAud')onAudio(el.files&&el.files[0]);
  else if(el.id==='fileProg'){const f=el.files&&el.files[0];if(!f)return;IMP.name=f.name;parseProgFile(f).then(r=>importDone(r,f.name)).catch(err=>{IMP.err=err.message;IMP.rows=null;refreshSheets()})}
  else if(el.id==='fileBackup'){const f=el.files&&el.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o||!Array.isArray(o.projects))throw 0;const mm=o.__media||{};delete o.__media;confirmSheet('Replace the data on this device with this backup?','Restore',()=>{const keep=S.profile;Object.keys(mm).forEach(k=>{MEDIA[k]=mm[k];idbPut(k,mm[k])});S=Object.assign(blank(),o);if(!S.profile)S.profile=keep;S.signedIn=true;closeAll();commit();toast('Backup restored')},'')}).catch(()=>toast('That file is not a Shift backup.'))}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='searchQ')searchResults(el.value);
  else if(el.id==='capText'&&topSheet()&&topSheet().kind==='task')capPreview();
  else if(el.dataset&&el.dataset.out){const o=$('#'+el.dataset.out);if(o)o.textContent=el.value+'%'}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&SH.length){closeSheet();return}
  if(e.key==='Enter'){
    if(e.target.id==='quickAdd'){e.preventDefault();A.quickAdd()}
    else if(e.target.id==='aiQ'){e.preventDefault();A.askSend()}
    else if(e.target.id==='capText'&&e.target.tagName==='INPUT'){e.preventDefault();const b=$('[data-act="capSave"]',topSheet().el);if(b)b.click()}
    else if(e.target.id==='searchQ')e.preventDefault();
    else if(e.target.id==='capText'&&e.target.tagName==='TEXTAREA'&&topSheet()&&topSheet().kind==='task'&&!e.shiftKey){e.preventDefault();const b=$('[data-act="capSave"]',topSheet().el);if(b)b.click()}
  }
});
window.addEventListener('online',()=>{renderTop();toast('Back online')});
window.addEventListener('offline',()=>{renderTop();toast('You are offline. Everything still saves on this device.')});

/* ----- boot ----- */
function boot(){
  S=loadState();
  $('.cap').innerHTML=[['task','plus','Task'],['note','notes','Note'],['photo','camera','Photo'],['voice','mic','Voice']].map(c=>'<button data-act="cap" data-k="'+c[0]+'" aria-label="Capture '+c[2].toLowerCase()+'"'+(c[0]==='task'?' class="tk"':'')+'>'+ic(c[1],18)+'<span>'+c[2]+'</span></button>').join('');
  $('#side-brand').innerHTML='<span class="mark">'+ic('check',16)+'</span>Shift';
  render();
  initMedia();
}
boot();

})();
</script>
